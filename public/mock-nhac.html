<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock nút nhạc</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#f4efea;color:#1f1a1b;padding:28px 16px 60px}
h1{font-size:22px;margin:0 0 4px;text-align:center}
.sub{color:#6f6668;text-align:center;margin:0 0 24px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;max-width:1080px;margin:0 auto}
.opt{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(80,30,40,.08)}
.opt h2{margin:0 0 4px;font-size:16px}.opt p{margin:0 0 12px;color:#6f6668;font-size:13px;min-height:36px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{position:relative;height:150px;border-radius:14px;overflow:hidden}
.sc.red{--accent:#8b0f1a;--paper:#fff7ec;background:linear-gradient(160deg,#9c1322,#6e0a14)}
.sc.cream{--accent:#b0413e;--paper:#fff;background:linear-gradient(160deg,#fbf3e8,#efe3d3)}
.sc small{position:absolute;left:10px;top:8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
.sc.red small{color:#fff}
.b{position:absolute;right:14px;bottom:14px}
/* A — cũ: tròn giấy, nốt ♫, quay khi phát */
.A{width:46px;height:46px;border-radius:50%;border:1px solid rgba(0,0,0,.08);background:var(--paper);color:var(--accent);display:grid;place-items:center;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.A.on span{display:inline-block;animation:spin 3s linear infinite}
/* B — tròn giấy, icon nốt nhạc nét mảnh; đang phát: vòng sóng lan */
.B{width:46px;height:46px;border-radius:50%;background:var(--paper);color:var(--accent);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.B svg{width:20px;height:20px}
.B.on::before,.B.on::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--paper);animation:ring 1.8s ease-out infinite}
.B.on::after{animation-delay:.9s}
.B.off svg{opacity:.55}.B.off::after{content:'';position:absolute;width:26px;height:2px;background:var(--accent);transform:rotate(-45deg);border-radius:2px;opacity:.8}
/* C — vạch nhạc (equalizer) */
.C{width:46px;height:46px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;gap:3px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.C i{width:3px;height:6px;border-radius:2px;background:var(--accent)}
.C.on i{animation:eq .9s ease-in-out infinite}.C.on i:nth-child(2){animation-delay:.15s}.C.on i:nth-child(3){animation-delay:.3s}.C.on i:nth-child(4){animation-delay:.45s}
.C.off i:nth-child(2){height:10px}.C.off i:nth-child(3){height:8px}
/* D — viên "♪ Nhạc" có chữ */
.D{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px 0 10px;border-radius:999px;background:var(--paper);color:var(--accent);font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.D .eq{display:flex;align-items:flex-end;gap:2px;height:14px}.D .eq i{width:3px;height:5px;border-radius:2px;background:var(--accent)}
.D.on .eq i{animation:eq .9s ease-in-out infinite}.D.on .eq i:nth-child(2){animation-delay:.2s}.D.on .eq i:nth-child(3){animation-delay:.4s}
/* E — tròn màu chủ đạo, loa trắng */
.E{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25),inset 0 0 0 2px rgba(255,255,255,.35)}
.E svg{width:21px;height:21px}
/* F — kính mờ, nốt nhạc mảnh + vòng tiến trình quay */
.F{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;border:1px solid rgba(255,255,255,.55);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.cream .F{color:var(--accent);background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.08)}
.F svg.n{width:20px;height:20px}
.F svg.r{position:absolute;inset:-1px;width:48px;height:48px}
.F.on svg.r{animation:spin 2.4s linear infinite}.F.off svg.r{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
@keyframes eq{0%,100%{height:5px}50%{height:16px}}
</style>
</head>
<body>
<h1>Chọn kiểu nút nhạc</h1>
<p class="sub">Nút nằm góc dưới bên phải thiệp. Mỗi kiểu có trạng thái tắt nhạc và đang phát, trên nền thiệp đỏ và nền kem.</p>
<div class="grid" id="g"></div>
<script>
const NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>';
const SPK = (on) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/>${on ? '<path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>' : '<path d="M16 9l5 6M21 9l-5 6"/>'}</svg>`;
const RING = '<svg class="r" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22.5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="34 108" stroke-linecap="round"/></svg>';
const O = [
  ['A', 'A · Như cũ', 'Tròn trắng, nốt ♫ màu thiệp, nốt xoay khi phát.', (on) => `<button class="b A ${on}"><span>♫</span></button>`],
  ['B', 'B · Nốt nhạc mảnh + sóng lan', 'Icon nốt nhạc nét mảnh; đang phát có hai vòng sóng nhẹ lan ra, tắt thì có gạch chéo.', (on) => `<button class="b B ${on}">${NOTE}</button>`],
  ['C', 'C · Vạch nhạc nhảy', 'Bốn vạch nhạc (equalizer) nhảy theo khi phát, đứng yên khi tắt. Gọn, hiện đại.', (on) => `<button class="b C ${on}"><i></i><i></i><i></i><i></i></button>`],
  ['D', 'D · Viên có chữ "Nhạc"', 'Rõ nghĩa nhất cho người lớn tuổi: vạch nhạc nhỏ + chữ "Nhạc" / "Tắt nhạc".', (on) => `<button class="b D ${on}"><span class="eq"><i></i><i></i><i></i></span>${on === 'on' ? 'Nhạc' : 'Bật nhạc'}</button>`],
  ['E', 'E · Loa trên nền màu thiệp', 'Nút tròn màu chủ đạo, icon loa trắng: có sóng khi phát, gạch khi tắt.', (on) => `<button class="b E ${on}">${SPK(on === 'on')}</button>`],
  ['F', 'F · Kính mờ + vòng quay', 'Nền kính mờ sang trọng, nốt nhạc mảnh; đang phát có vòng sáng mảnh quay quanh.', (on) => `<button class="b F ${on}">${NOTE.replace('<svg', '<svg class="n"')}${RING}</button>`],
];
document.getElementById('g').innerHTML = O.map(([k, t, d, f]) => `<div class="opt"><h2>${t}</h2><p>${d}</p><div class="row">
  <div class="sc red"><small>Đang phát</small>${f('on')}</div><div class="sc cream"><small>Đang phát</small>${f('on')}</div>
  <div class="sc red"><small>Tắt</small>${f('off')}</div><div class="sc cream"><small>Tắt</small>${f('off')}</div></div></div>`).join('');
</script>
</body>
</html>
