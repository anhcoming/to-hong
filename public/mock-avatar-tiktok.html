<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock — avatar Cưới Nha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@1,600&display=swap">
<style>
body{margin:0;padding:28px;background:#1b1b1b;color:#eee;font-family:'Be Vietnam Pro',system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}p.d{margin:0 0 24px;color:#aaa;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:28px}
.opt{width:260px}
.opt h2{font-size:14px;margin:12px 0 2px}.opt small{color:#aaa;font-size:12.5px;line-height:1.4;display:block}
.big{width:260px;height:260px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px #333}
.sm{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:#aaa}
.sm span{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 1px #333}
.sm span.x{width:28px;height:28px}
svg{display:block;width:100%;height:100%}
</style></head><body>
<h1>Avatar TikTok — Cưới Nha</h1>
<p class="d">Xem ở cỡ to + cỡ thật trong bình luận / danh sách (44px, 28px). Ảnh xuất 1080×1080.</p>
<div class="row" id="row"></div>

<template id="A"><svg viewBox="0 0 1080 1080"><defs><linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6455d"/><stop offset="1" stop-color="#ef7d8d"/></linearGradient></defs>
<rect width="1080" height="1080" fill="url(#gA)"/>
<text x="540" y="600" text-anchor="middle" font-family="Dancing Script" font-weight="700" font-size="250" fill="#fff">Cưới Nha</text>
<path transform="translate(815 330) scale(4.2)" d="M16 28C6.5 21 3 16 3 11.5 3 7.9 5.8 5 9.4 5c2.6 0 4.6 1.4 6.6 3.9C18 6.4 20 5 22.6 5 26.2 5 29 7.9 29 11.5 29 16 25.5 21 16 28z" fill="#fff"/>
<text x="540" y="740" text-anchor="middle" font-family="Be Vietnam Pro" font-weight="600" font-size="58" letter-spacing="10" fill="#fff" opacity=".9">THIỆP CƯỚI ONLINE</text></svg></template>

<template id="B"><svg viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#fff7f6"/>
<circle cx="540" cy="540" r="440" fill="none" stroke="#e9b7c0" stroke-width="6"/>
<text x="540" y="590" text-anchor="middle" font-family="Dancing Script" font-weight="700" font-size="250" fill="#d6455d">Cưới Nha</text>
<path transform="translate(810 330) scale(4.2)" d="M16 28C6.5 21 3 16 3 11.5 3 7.9 5.8 5 9.4 5c2.6 0 4.6 1.4 6.6 3.9C18 6.4 20 5 22.6 5 26.2 5 29 7.9 29 11.5 29 16 25.5 21 16 28z" fill="#ef7d8d"/>
<text x="540" y="730" text-anchor="middle" font-family="Be Vietnam Pro" font-weight="600" font-size="54" letter-spacing="10" fill="#8a6a6f">THIỆP CƯỚI ONLINE</text></svg></template>

<template id="C"><svg viewBox="0 0 1080 1080"><defs><linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6455d"/><stop offset="1" stop-color="#ef7d8d"/></linearGradient></defs>
<rect width="1080" height="1080" fill="url(#gC)"/>
<text x="540" y="700" text-anchor="middle" font-family="Dancing Script" font-weight="700" font-size="520" fill="#fff">CN</text>
<path transform="translate(760 250) scale(5)" d="M16 28C6.5 21 3 16 3 11.5 3 7.9 5.8 5 9.4 5c2.6 0 4.6 1.4 6.6 3.9C18 6.4 20 5 22.6 5 26.2 5 29 7.9 29 11.5 29 16 25.5 21 16 28z" fill="#fff"/></svg></template>

<template id="D"><svg viewBox="0 0 1080 1080"><defs><linearGradient id="gD" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6455d"/><stop offset="1" stop-color="#ef7d8d"/></linearGradient></defs>
<rect width="1080" height="1080" fill="url(#gD)"/>
<!-- phong bì thiệp + con dấu tim -->
<rect x="250" y="340" width="580" height="400" rx="34" fill="#fff"/>
<path d="M262 362 540 580 818 362" fill="none" stroke="#f3c6cf" stroke-width="26" stroke-linejoin="round"/>
<circle cx="540" cy="585" r="92" fill="#d6455d"/>
<path transform="translate(492 540) scale(3)" d="M16 28C6.5 21 3 16 3 11.5 3 7.9 5.8 5 9.4 5c2.6 0 4.6 1.4 6.6 3.9C18 6.4 20 5 22.6 5 26.2 5 29 7.9 29 11.5 29 16 25.5 21 16 28z" fill="#fff"/>
<text x="540" y="880" text-anchor="middle" font-family="Dancing Script" font-weight="700" font-size="120" fill="#fff">Cưới Nha</text></svg></template>

<template id="E"><svg viewBox="0 0 1080 1080"><defs><linearGradient id="gE" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6455d"/><stop offset="1" stop-color="#ef7d8d"/></linearGradient></defs>
<rect width="1080" height="1080" fill="url(#gE)"/>
<!-- hai nhẫn cưới lồng nhau, tim nhỏ phía trên -->
<circle cx="450" cy="600" r="170" fill="none" stroke="#fff" stroke-width="44"/>
<circle cx="630" cy="600" r="170" fill="none" stroke="#ffd9df" stroke-width="44"/>
<path d="M450 430 a170 170 0 0 1 0 0" />
<path transform="translate(492 225) scale(3)" d="M16 28C6.5 21 3 16 3 11.5 3 7.9 5.8 5 9.4 5c2.6 0 4.6 1.4 6.6 3.9C18 6.4 20 5 22.6 5 26.2 5 29 7.9 29 11.5 29 16 25.5 21 16 28z" fill="#fff"/>
<text x="540" y="905" text-anchor="middle" font-family="Dancing Script" font-weight="700" font-size="110" fill="#fff">Cưới Nha</text></svg></template>

<script>
var O = [['A', 'Chữ trắng trên nền hồng', 'Tên thương hiệu rõ nhất, đồng bộ màu web. Cỡ nhỏ vẫn đọc được "Cưới Nha".'],
  ['B', 'Chữ hồng trên nền kem', 'Nhẹ nhàng, sang; nổi bật trên nền tối của TikTok. Cỡ nhỏ hơi nhạt.'],
  ['C', 'Monogram CN + tim', 'To, đậm, cỡ 28px vẫn rõ — nhưng người lạ không đọc ra "Cưới Nha".'],
  ['D', 'Phong bì thiệp + dấu tim', 'Nói ngay là thiệp cưới; tên nhỏ bên dưới.'],
  ['E', 'Hai nhẫn cưới', 'Biểu tượng đám cưới, tên nhỏ bên dưới.']];
var row = document.getElementById('row');
O.forEach(function (o) {
  var svg = document.getElementById(o[0]).innerHTML;
  row.insertAdjacentHTML('beforeend', '<div class="opt"><div class="big">' + svg + '</div><div class="sm"><span>' + svg + '</span><span class="x">' + svg + '</span> cỡ thật</div><h2>' + o[0] + ' · ' + o[1] + '</h2><small>' + o[2] + '</small></div>');
});
</script>
</body></html>
