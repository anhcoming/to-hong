<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<title>Ảnh bìa Facebook — Cưới Nha (1640×624)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Dancing+Script:wght@700&display=block">
<style>
/* Ảnh bìa trang Facebook 1640×624. Máy tính hiện đủ; điện thoại cắt hai bên còn ~1110px giữa (x 265 → 1375) → chữ và mẫu nằm gọn trong vùng đó */
*{box-sizing:border-box}
html,body{margin:0}
body{width:1640px;height:624px;overflow:hidden;font-family:'Be Vietnam Pro',sans-serif}
.cv{position:relative;width:1640px;height:624px;overflow:hidden;background:radial-gradient(900px 520px at 78% 40%,#ffe3e8 0,rgba(255,227,232,0) 70%),linear-gradient(120deg,#fff9f8 0%,#fff1f2 55%,#ffe6ea 100%)}
/* hoa văn nhẹ: chấm tim mờ */
.cv::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#f3c6cf 1.4px,transparent 1.6px);background-size:34px 34px;opacity:.35;-webkit-mask:linear-gradient(90deg,transparent 0,#000 35%,#000 65%,transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 35%,#000 65%,transparent 100%)}
.l{position:absolute;left:300px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:86px;height:86px;flex:none;filter:drop-shadow(0 8px 18px rgba(214,69,93,.3))}
.brand b{font:700 96px/1 'Dancing Script',cursive;color:#d6455d;letter-spacing:-.5px}
h1{margin:18px 0 0;font-size:36px;line-height:1.25;font-weight:800;color:#2a1d20;letter-spacing:-.02em}
h1 em{font-style:normal;color:#d6455d}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}
.chips span{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px #f3dfe2,0 6px 16px rgba(120,40,50,.06);font-size:17px;font-weight:600;color:#3a2a2d}
.chips span.free{background:#d6455d;color:#fff;box-shadow:0 8px 20px rgba(214,69,93,.3)}
.url{margin-top:24px;font-size:22px;font-weight:700;color:#8a6a6f;letter-spacing:.02em}
.url b{color:#d6455d}
/* bên phải: TV màn LED phía sau + 3 điện thoại mẫu thiệp xoè quạt */
.r{position:absolute;left:860px;top:0;width:500px;height:624px}
.tv{position:absolute;left:120px;top:56px;width:380px;height:214px;border-radius:14px;overflow:hidden;background:#05070f;box-shadow:0 0 0 7px #2b2224,0 22px 44px rgba(40,10,20,.28);transform:rotate(3deg)}
.tv img{width:100%;height:100%;object-fit:cover;display:block}
.tv i{position:absolute;left:12px;bottom:10px;font:700 13px 'Be Vietnam Pro';color:#fff;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:999px;font-style:normal}
.ph{position:absolute;width:158px;height:326px;border-radius:26px;padding:7px;background:#1e1618;box-shadow:0 26px 50px rgba(60,15,25,.32)}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:20px;display:block}
.p1{left:10px;top:205px;transform:rotate(-9deg)}
.p2{left:140px;top:235px;z-index:2;transform:rotate(0deg)}
.p3{left:270px;top:215px;transform:rotate(8deg)}
.tag{position:absolute;z-index:3;left:225px;top:568px;transform:translateX(-50%);white-space:nowrap;padding:8px 18px;border-radius:999px;background:#fff;font-size:16px;font-weight:700;color:#d6455d;box-shadow:0 10px 24px rgba(120,40,50,.18)}
</style></head><body>
<div class="cv">
  <div class="l">
    <div class="brand">
      <svg viewBox="0 0 1080 1080"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6455d"/><stop offset="1" stop-color="#ef7d8d"/></linearGradient></defs><circle cx="540" cy="540" r="540" fill="url(#g)"/><circle cx="440" cy="620" r="200" fill="none" stroke="#fff" stroke-width="52"/><circle cx="640" cy="620" r="200" fill="none" stroke="#ffd9df" stroke-width="52"/><path d="M 491.8 426.8 A 200 200 0 0 1 581.4 478.6" fill="none" stroke="#fff" stroke-width="52"/><path transform="translate(468 200) scale(4.5)" d="M16 28C6.5 21 3 16 3 11.5 3 7.9 5.8 5 9.4 5c2.6 0 4.6 1.4 6.6 3.9C18 6.4 20 5 22.6 5 26.2 5 29 7.9 29 11.5 29 16 25.5 21 16 28z" fill="#fff"/></svg>
      <b>Cưới Nha</b>
    </div>
    <h1>Thiệp cưới online đẹp<br><em>Chọn mẫu, điền tên, gửi khách</em></h1>
    <div class="chips">
      <span>💌 49 mẫu thiệp</span><span>🖥️ Màn hình LED</span><span>🎞️ Slide cưới</span><span class="free">🎁 Video báo hỷ miễn phí</span>
    </div>
    <div class="url">👉 <b>cuoinha.com</b></div>
  </div>
  <div class="r">
    <div class="tv"><img src="/demo/lposter-bac-dembac.jpg" alt=""><i>Màn hình LED tiệc cưới</i></div>
    <div class="ph p1"><img src="/demo/cover-songhy-do.jpg" alt=""></div>
    <div class="ph p2"><img src="/demo/cover-dodam-do-ruou.jpg" alt=""></div>
    <div class="ph p3"><img src="/demo/cover-thanhdiep-xanh-la.jpg" alt=""></div>
    <div class="tag">Xác nhận dự tiệc · bản đồ · mừng cưới QR</div>
  </div>
</div>
</body></html>
