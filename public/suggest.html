<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thả ảnh cưới, xem ngay thiệp của bạn | Cưới Nha</title>
<meta name="description" content="Chọn vài tấm ảnh cưới, Cưới Nha tự gợi ý các mẫu thiệp hợp tông ảnh và hiện ngay thiệp có ảnh của bạn. Ảnh chỉ nằm trên máy bạn cho tới khi bạn chọn dùng.">
<meta property="og:title" content="Thả ảnh cưới, xem ngay thiệp của bạn — Cưới Nha">
<meta property="og:description" content="Chọn vài tấm ảnh cưới, xem ngay các mẫu thiệp hợp tông ảnh của bạn. Miễn phí, chưa cần đăng ký.">
<meta property="og:image" content="https://cuoinha.com/demo/cover-dodam-do-ruou.jpg">
<meta property="og:url" content="https://cuoinha.com/goi-y">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cưới Nha">
<meta property="og:locale" content="vi_VN">
<meta name="theme-color" content="#fffafa">
<link rel="canonical" href="https://cuoinha.com/goi-y">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/css/site.css">
<style>
/* Trang gợi ý thiệp từ ảnh: ô thả ảnh → dải ảnh đã chọn + tên/ngày → một thiệp lớn ghép ảnh của bạn + dải mẫu gợi ý để đổi (điện thoại: gọn một màn) */
main.wrap{padding-top:112px;padding-bottom:64px;max-width:1120px}
.gy-head{text-align:center;margin:0 auto 22px;max-width:640px}
.gy-head h1{font:800 clamp(28px,5.4vw,44px)/1.16 var(--serif);letter-spacing:-.02em;margin:0 0 10px}
.gy-head h1 em{font-family:var(--script);font-style:normal;font-size:1.14em;color:var(--red)}
.drop{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px;margin:0 auto;padding:36px 20px;border:2px dashed #eebcc4;border-radius:24px;background:var(--card);text-align:center;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--red);background:var(--bg2)}
.drop svg{color:var(--red)}
.drop b{font-size:17px}
.drop small{color:var(--muted);font-size:13px;line-height:1.5;max-width:380px}
.note{display:flex;gap:8px;justify-content:center;align-items:center;margin:14px auto 0;color:var(--muted);font-size:13px;text-align:center}
#msg{max-width:560px;margin:14px auto 0;padding:10px 14px;border-radius:12px;background:var(--bg2);color:var(--ink);font-size:14px;text-align:center}
#msg.bad{background:#fdecec;color:#a02a2a}
.bar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.bar b{font-size:15px}
.bar button{margin-left:auto;border:0;background:none;color:var(--muted);font:500 13px var(--sans);text-decoration:underline;cursor:pointer;padding:8px 0}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.th{position:relative;flex:none;width:64px;height:80px;border-radius:12px;background:#eee center/cover;border:1px solid var(--line)}
.th button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:#fff;font:600 14px/1 var(--sans);cursor:pointer}
.th.add{display:grid;place-items:center;border:1.5px dashed #eebcc4;background:var(--card);color:var(--red);font:500 26px/1 var(--sans);cursor:pointer}
.who{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:8px 0 22px}
.who label{display:grid;gap:4px;font-size:13px;font-weight:600;min-width:0}
.who input{width:100%;min-width:0;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:16px var(--sans)}
.who input:focus{outline:0;border-color:#f2b6bf}
/* chọn mẫu: một thiệp lớn (ảnh của bạn ghép sẵn) + dải ảnh bìa các mẫu gợi ý, chạm để đổi; nút "Dùng thiệp này" luôn trong tầm tay */
.gpick{display:grid;grid-template-columns:400px 1fr;gap:28px;align-items:start}
.sg-view{position:relative;width:100%;border-radius:20px;overflow:hidden;background:linear-gradient(100deg,var(--bg2) 30%,rgba(255,255,255,.7) 50%,var(--bg2) 70%) 0 0/200% 100%;animation:sgsh 1.3s linear infinite;box-shadow:0 14px 36px rgba(120,40,50,.14)}
.sg-view.big{height:min(760px,calc(100vh - 140px))}
.sg-view:has(iframe.on){animation:none;background:var(--bg2)}
@keyframes sgsh{to{background-position:-200% 0}}
[data-theme="dark"] .sg-view{background:linear-gradient(100deg,var(--bg2) 30%,rgba(255,255,255,.07) 50%,var(--bg2) 70%) 0 0/200% 100%}
[data-theme="dark"] .sg-view:has(iframe.on){background:var(--bg2)}
.sg-view iframe{position:absolute;left:0;top:0;width:375px;border:0;transform-origin:0 0;opacity:0;transition:opacity .35s}
.sg-view iframe.on{opacity:1}
.sg-wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none}
.sg-view iframe.on+.sg-wait{display:none}
.pside{display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:100px}
.pmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:15px}
.pmeta b{font-size:20px}
.pmeta span{color:var(--muted)}
.sg-chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--bg2);color:var(--red);font-size:12px;font-weight:700}
.sg-chip.best{background:var(--red);color:#fff}
.sg-why{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.strip button,.strip a{display:flex;flex-direction:column;gap:5px;min-width:0;border:0;padding:0;background:none;font:inherit;color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.strip i{display:block;width:100%;aspect-ratio:3/4.4;border-radius:12px;background:var(--bg2) top/cover;border:2.5px solid transparent;transition:border-color .2s,transform .2s}
.strip button.on i{border-color:var(--red);transform:translateY(-3px)}
.strip small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip button.on small{color:var(--red);font-weight:700}
.strip a i{display:grid;place-items:center;border:1.5px dashed #eebcc4;background:var(--card);color:var(--red);font:600 13px/1.3 var(--sans);font-style:normal;padding:6px}
.pcta .btn{width:100%}
.pcta{order:2}.strip{order:3} /* máy tính: nút ngay dưới tên mẫu, dải mẫu dài bên dưới */
.mrow,.mwho{display:none}
.after{margin:18px 0 0;color:var(--muted);font-size:13px;text-align:center}
@media (max-width:760px){
  main.wrap{padding-top:96px}
  .who{grid-template-columns:1fr 1fr}
  .who label:last-child{grid-column:1/-1}
  /* đã có ảnh: trang thành một màn — thanh gọn, thiệp lớn chiếm phần còn lại, dải mẫu + nút ở đáy */
  body.gy-on #nav,body.gy-on #foot,body.gy-on .gy-head,body.gy-on .after{display:none}
  body.gy-on main.wrap{padding:0;max-width:none}
  body.gy-on #work{display:flex;flex-direction:column;height:100vh;height:100dvh}
  body.gy-on #msg{margin:8px 14px 0}
  .mrow{display:flex;flex:none;align-items:center;gap:10px;padding:10px 14px 0}
  .mrow .logo{margin-right:auto;font:700 24px/1 var(--script);color:var(--red);text-decoration:none}
  .mrow button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:4px 11px 4px 4px;font:600 12.5px var(--sans);color:var(--ink);cursor:pointer}
  .mrow button i{display:flex}
  .mrow button i b{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);background:#eee center/cover;margin-left:-9px}
  .mrow button i b:first-child{margin-left:0}
  .mwho{display:flex;flex:none;align-items:center;gap:6px;margin:8px 14px 0;padding:9px 12px;border:0;border-radius:12px;background:rgba(214,69,93,.08);font:13px var(--sans);color:var(--muted);text-align:left;cursor:pointer}
  .mwho b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mwho span{margin-left:auto;color:var(--red);font-weight:700}
  #work .bar,#work .thumbs,#work .who{display:none}
  #work.ph .bar,#work.ph .thumbs,#work.wh .who{display:flex;margin:8px 14px 0}
  #work.wh .who{display:grid}
  .gpick{flex:1;min-height:0;display:flex;flex-direction:column;align-items:stretch;gap:0;margin-top:10px}
  .sg-view.big{flex:1;min-height:0;height:auto;width:auto;margin:0 14px;border-radius:20px}
  .pside{position:static;gap:8px;padding:10px 0 0}
  .pmeta{padding:0 16px;font-size:13px}
  .pmeta b{font-size:16px}
  .sg-why{display:none}
  .strip{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 2px;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .strip button,.strip a{flex:none;width:58px;gap:3px}
  .strip i{height:82px;aspect-ratio:auto;border-radius:11px}
  .strip small{font-size:10.5px}
  .strip a i{font-size:10.5px}
  .pcta{order:4;padding:6px 14px calc(10px + env(safe-area-inset-bottom))}
  .pcta .btn{padding:15px;font-size:16px}
}
</style>
</head>
<body data-page="goiy">
<header id="nav"></header>

<main class="wrap">
  <div class="gy-head">
    <h1>Thả ảnh cưới vào, <em>xem ngay thiệp của bạn</em></h1>
  </div>

  <section id="drop" class="drop">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 15l-4.5-4.5L8 19"/></svg>
    <b>Chọn 3–12 ảnh cưới của bạn</b>
    <button type="button" class="btn btn-main btn-lg" id="pick">Chọn ảnh</button>
    <small>Trên máy tính có thể kéo thả ảnh vào đây. Ảnh dọc, rõ mặt hai bạn sẽ cho thiệp đẹp nhất.</small>
  </section>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <p id="msg" role="status" hidden></p>

  <section id="work" hidden>
    <div class="mrow"><a class="logo" href="/">Cưới Nha</a><button type="button" id="mPh"><i id="mPhI"></i><span id="mPhN"></span></button></div>
    <button type="button" class="mwho" id="mWho"></button>
    <div class="bar"><b id="count"></b><button type="button" id="reset">Chọn lại từ đầu</button></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="who">
      <label>Tên chú rể<input id="f-groom" maxlength="40" placeholder="Gia Huy" autocomplete="off"></label>
      <label>Tên cô dâu<input id="f-bride" maxlength="40" placeholder="Bảo Ngọc" autocomplete="off"></label>
      <label>Ngày cưới<input id="f-date" type="date"></label>
    </div>
    <div class="gpick">
      <div class="sg-view big" id="big"><iframe title="Xem thử thiệp với ảnh của bạn"></iframe><span class="sg-wait">Đang dựng thiệp…</span></div>
      <div class="pside">
        <div class="pmeta" id="pmeta"></div>
        <p class="sg-why" id="pwhy"></p>
        <div class="strip" id="strip" role="listbox" aria-label="Các mẫu gợi ý"></div>
        <div class="pcta"><button type="button" class="btn btn-main btn-lg" id="useBtn">Dùng thiệp này</button></div>
      </div>
    </div>
    <p class="after">Chưa ưng? <a href="/mau-thiep" style="color:var(--red);font-weight:600">Xem cả bộ sưu tập mẫu</a> — vào trình sửa bạn vẫn đổi mẫu, đổi màu, căn lại ảnh được.</p>
  </section>
</main>

<footer id="foot"></footer>
<script src="/js/site.js"></script>
<script src="/js/photoprep.js"></script>
<script src="/js/suggest.js"></script>
</body>
</html>
