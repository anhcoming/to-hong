<link rel="canonical" href="https://cuoinha.com/slide-cuoi">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<link rel="stylesheet" href="/css/site.css">
<style>
/* giống trang Mẫu thiệp: tiêu đề gọn · thanh lọc · lưới mẫu; bấm mẫu → lớp xem mẫu (site.js tplView) chạy thật, trong đó có "Dùng mẫu" */
.slp{padding:110px 0 70px}
.thead{margin:0 0 18px}.thead h1{margin:0;font-family:var(--serif);font-weight:800;letter-spacing:-.02em;font-size:32px;line-height:1.2}.thead p{margin:4px 0 0;color:var(--muted);font-size:15px}
.flist{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 20px}.flist::-webkit-scrollbar{display:none}
.flist button{flex:none;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:500 14px var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap}
.flist button:hover{border-color:#f2b6bf}
.flist button[aria-pressed="true"]{border-color:var(--red);background:#fff0f2;color:var(--red);font-weight:600}
[data-theme="dark"] .flist button[aria-pressed="true"]{background:#3a1f26}
.flist a.fx{flex:none;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:500 14px var(--sans);color:var(--ink);text-decoration:none;white-space:nowrap}
.flist a.fx i{background:#d6455d;color:#fff;font-weight:700}
.flist i{font-style:normal;font-size:11.5px;line-height:1;padding:3px 7px;border-radius:999px;background:var(--bg2);color:var(--muted)}
.flist button[aria-pressed="true"] i{background:#ffd9df;color:var(--red)}
.vgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.vt{all:unset;position:relative;cursor:pointer;display:block;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#1a1012;border:1px solid var(--line);box-shadow:0 12px 30px rgba(120,40,50,.07);transition:transform .25s,box-shadow .25s}
.vt:hover{transform:translateY(-4px);box-shadow:0 22px 44px rgba(120,40,50,.14)}
.vt:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.vt img{width:100%;height:100%;object-fit:cover;display:block}
.vt iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;pointer-events:none;transform-origin:0 0;opacity:0;transition:opacity .4s}
.vt iframe.on{opacity:1}
.vt .tag{position:absolute;top:12px;left:12px;z-index:2;padding:4px 11px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700}
.vt b{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:34px 16px 12px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.62));color:#fff;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.35)} /* tên mẫu đè góc dưới ảnh, như thẻ mẫu thiệp */
@media (max-width:860px){
  .slp{padding:86px 0 40px}
  .thead{margin:0 0 2px}.thead h1{font-size:22px}.thead p{display:none} /* điện thoại: tiêu đề một dòng */
  /* điện thoại: thanh tab gạch chân, không số */
  .flist{margin:0 -16px 18px;padding:0 16px;gap:0 20px;border-bottom:1px solid var(--line)}
  .flist button,.flist button:hover{height:auto;gap:0;padding:12px 0 11px;margin-bottom:-1px;border:0;border-bottom:2.5px solid transparent;border-radius:0;background:none;font:600 15px var(--sans);color:var(--muted)}
  .flist button[aria-pressed="true"],[data-theme="dark"] .flist button[aria-pressed="true"]{background:none;color:var(--ink);border-bottom-color:var(--red)}
  .flist i{display:none}
  .flist a.fx{height:auto;padding:12px 0 11px;margin-bottom:-1px;border:0;border-radius:0;background:none;font:600 15px var(--sans);color:var(--muted)}
  .flist a.fx i{display:inline-block;font-size:10px;padding:2px 6px}
}
@media (max-width:600px){
  .vgal{grid-template-columns:1fr;gap:14px} /* mỗi mẫu một hàng cho to */
  .vt{border-radius:12px}.vt b{padding:30px 14px 11px;font-size:17px}.vt .tag{top:10px;left:10px}
}
</style>
</head>
<body data-page="slide">
<header id="nav"></header>

<section class="slp"><div class="wrap">
  <div class="thead"><h1>Mẫu slide cưới</h1><p>Thả ảnh cưới, tự xếp thành video chiếu màn LED, TV khi khách vào tiệc · bấm mẫu để xem thử</p></div>
  <div class="flist" id="flist" role="group" aria-label="Lọc mẫu slide"></div>
  <div class="vgal" id="vgal" aria-live="polite"></div>
</div></section>

<footer id="foot"></footer>
<script src="/js/site.js"></script>
<script>
(function () {
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var G = [{ id: '', name: 'Tất cả' }, { id: 'le', name: 'Nền buổi lễ' }, { id: 'phim', name: 'Phim kể chuyện' }];
  var cur = '';
  document.addEventListener('meta', function (ev) {
    // nền buổi lễ (kind 'le') đứng đầu, rồi phim kể chuyện (mẫu chèn ảnh khác)
    var all = (ev.detail.video && ev.detail.video.templates || []).filter(function (t) { return t.kind === 'le' || t.photos; });
    all.sort(function (a, b) { return (b.kind === 'le') - (a.kind === 'le'); });
    var grp = function (t) { return t.kind === 'le' ? 'le' : 'phim'; };
    var fl = document.getElementById('flist'), g = document.getElementById('vgal');
    function draw() {
      fl.innerHTML = G.map(function (x) {
        var n = all.filter(function (t) { return !x.id || grp(t) === x.id; }).length;
        return '<button type="button" data-g="' + x.id + '" aria-pressed="' + (x.id === cur) + '"><span>' + x.name + '</span><i>' + n + '</i></button>';
      }).join('') + '<a class="fx" href="/video">Báo hỷ TikTok <i>Free</i></a>'; // video báo hỷ miễn phí: trang riêng, cùng nhóm "Video" ở thanh dưới
      g.innerHTML = all.filter(function (t) { return !cur || grp(t) === cur; }).map(function (t) {
        return '<a class="vt" data-id="' + t.id + '" href="/video/demo?template=' + t.id + '" aria-label="Xem thử mẫu ' + esc(t.name) + '">'
          + '<span class="tag">' + (t.kind === 'le' ? '2:00 · ' : '') + t.slots + ' ảnh</span>'
          + '<img src="/demo/vposter-' + t.id + '.jpg" alt="Mẫu slide ảnh cưới ' + esc(t.name) + '" loading="lazy"><b>' + esc(t.name) + '</b></a>';
      }).join('');
    }
    fl.addEventListener('click', function (e) { var b = e.target.closest('[data-g]'); if (!b) return; cur = b.dataset.g; draw(); });
    // bấm mẫu: lớp xem mẫu chạy thật, xem xong mới bấm "Dùng mẫu"
    g.addEventListener('click', function (e) {
      var a = e.target.closest('.vt'); if (!a || !window.tplView || e.metaKey || e.ctrlKey) return;
      e.preventDefault();
      var t = all.find(function (x) { return x.id === a.dataset.id; });
      tplView({ name: t.name, wide: true, src: '/video/demo?preview=1&template=' + t.id, use: '/tao-video?mau=' + t.id });
    });
    draw();
    // rê chuột (máy tính): phát thử video thật trong thẻ, thu nhỏ từ 1280×720
    if (!matchMedia('(hover:hover)').matches) return;
    var f = null, tm = 0;
    g.addEventListener('mouseover', function (e) {
      var c = e.target.closest('.vt'); if (!c || c.contains(e.relatedTarget)) return;
      clearTimeout(tm);
      tm = setTimeout(function () {
        if (f) f.remove();
        f = document.createElement('iframe');
        f.src = '/video/demo?preview=1&template=' + c.dataset.id; f.tabIndex = -1; f.title = 'Xem trước';
        f.style.transform = 'scale(' + c.clientWidth / 1280 + ')';
        var me = f; f.onload = function () { setTimeout(function () { me.classList.add('on'); }, 300); };
        c.insertBefore(f, c.querySelector('.tag'));
      }, 250);
    });
    g.addEventListener('mouseout', function (e) {
      var c = e.target.closest('.vt'); if (!c || c.contains(e.relatedTarget)) return;
      clearTimeout(tm); if (f) { f.remove(); f = null; }
    });
  });
})();
</script>
</body>
</html>
