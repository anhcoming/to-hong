<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Thiệp của tôi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:32px 0 20px;flex-wrap:wrap}
.head h1{font-family:var(--serif);font-weight:600;margin:0;font-size:32px}
.list{display:grid;gap:14px}
.item{display:grid;grid-template-columns:120px 1fr} /* không cắt overflow: menu ⋯ cần tràn ra ngoài */
.item>.thumb{border-radius:inherit;border-top-right-radius:0;border-bottom-right-radius:0}
.thumb{background:linear-gradient(150deg,#e9cfd3,#d7b07a) center/cover;min-height:150px;display:grid;place-items:center;color:#fff;font-size:34px}
.info{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top h3{margin:0;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.vitem{grid-template-columns:220px 1fr}.vitem .thumb{min-height:124px;background-size:cover;background-position:center}
.more{position:relative}.more summary{list-style:none;cursor:pointer}.more summary::-webkit-details-marker{display:none}
.more>div{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:170px;padding:6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.14)}
.more button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.more.flip>div{right:auto;left:0}
.more button:hover{background:var(--primary-soft)}.more button.danger{color:#c0392b}
@media (max-width:560px){.vitem{grid-template-columns:120px 1fr}}
.link{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.item{grid-template-columns:84px 1fr}.thumb{min-height:120px}}
.trialbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:10px 0 2px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.trialbar b.cd{font-variant-numeric:tabular-nums;white-space:nowrap}
.trialbar.soon,.trialbar.over{background:#fde8e6;color:var(--danger)}
.upbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:10px 0 2px;padding:10px 12px;border-radius:12px;background:var(--primary-soft);font-size:14px}
.upbar b{color:var(--primary)}
</style>
</head>
<body>
<main class="wrap" style="padding-bottom:60px">
  <div class="head">
    <div><h1 id="pageTitle">Thiệp của tôi</h1><p class="muted" style="margin:4px 0 0" id="pageSub">Quản lý thiệp, khách mời và phản hồi</p></div>
    <button class="btn lg" id="newBtn">+ Tạo thiệp mới</button>
  </div>
  <div class="list" id="list"><div class="skeleton" style="height:150px"></div></div>
</main>
<script src="/js/common.js"></script>
<script src="/js/pay.js"></script>
<script>
let META;
// cùng một trang cho hai danh sách: /thiep-cua-toi (thiệp) và /video-cua-toi (video cưới)
const VIDEOS = location.pathname === '/video-cua-toi';
const tplName = (id) => (META.templates.find(t => t.id === id) || {}).name || id;

const isCombo = (c) => c.paid && c.led.paid && c.video.paid;
function stateChip(c) {
  if (isCombo(c)) return '<span class="chip ok">● Trọn bộ đã kích hoạt</span><span class="chip ok">Thiệp</span><span class="chip ok">Màn LED</span><span class="chip ok">Video</span>';
  if (c.paid) return '<span class="chip ok">● Thiệp đã kích hoạt</span>';
  if (c.status !== 'published') return '<span class="chip">Bản nháp</span>';
  if (c.expired) return '<span class="chip red">Hết hạn dùng thử</span>';
  const days = Math.max(0, Math.ceil((c.trialEndsAt - Date.now()) / 864e5));
  return `<span class="chip warn">Dùng thử · còn ${days} ngày</span>`;
}

// Thiệp đã kích hoạt lẻ, chưa có LED / video: gợi ý nâng lên Trọn bộ (chỉ trả phần chênh)
function upgradeBar(c) {
  if (!c.paid || c.led.paid || c.video.paid || !META.comboPrice) return '';
  const add = Math.max(0, META.comboPrice - META.price), retail = META.ledPrice + META.videoPrice;
  return `<div class="upbar"><span>✨ Thêm <b>màn LED tiệc cưới + video MP4</b> chỉ <b>${money(add)}</b> <span class="muted">(mua lẻ ${money(retail)})</span></span><button class="btn sm" data-a="combo">Nâng lên Trọn bộ</button></div>`;
}

// Thiệp đã phát hành, chưa kích hoạt: thanh đếm ngược tới lúc link bị khoá (chạy từng giây)
function trialBar(c) {
  if (c.paid || c.status !== 'published') return '';
  if (c.expired) return `<div class="trialbar over"><span>🔒 <b>Link đã bị khoá</b> — khách mở thiệp sẽ thấy "Thiệp đang tạm khoá". Kích hoạt để mở lại ngay.</span><button class="btn sm" data-a="pay">Kích hoạt</button></div>`;
  return `<div class="trialbar" data-end="${c.trialEndsAt}"><span>⏳ Link sẽ bị khoá sau <b class="cd">${countdown(c.trialEndsAt)}</b></span><button class="btn sm" data-a="pay">Kích hoạt</button></div>`;
}
function countdown(end) {
  const s = Math.max(0, Math.floor((end - Date.now()) / 1000));
  const d = Math.floor(s / 86400), p = (n) => String(n).padStart(2, '0');
  const hms = `${p(Math.floor(s % 86400 / 3600))}:${p(Math.floor(s % 3600 / 60))}:${p(s % 60)}`;
  return d ? `${d} ngày ${hms}` : hms;
}
setInterval(() => {
  let ended = false;
  $$('.trialbar[data-end]').forEach((el) => {
    const end = +el.dataset.end;
    el.querySelector('.cd').textContent = countdown(end);
    el.classList.toggle('soon', end - Date.now() < 864e5);
    if (end <= Date.now()) ended = true;
  });
  if (ended) load(); // hết giờ → tải lại để hiện "Link đã bị khoá"
}, 1000);

function ledChip(c) {
  if (isCombo(c)) return '';
  const one = (s, n) => !s.created ? '' : s.paid ? `<span class="chip ok">${n} · đã kích hoạt</span>`
    : s.expired ? `<span class="chip red">${n} · hết dùng thử</span>` : `<span class="chip warn">${n} · dùng thử</span>`;
  return one(c.led, 'Màn LED');
}

async function load() {
  const { cards } = await api('/api/cards');
  const el = $('#list');
  if (VIDEOS) return loadVideos(cards, el);
  if (!cards.length) {
    el.innerHTML = `<div class="panel empty"><p style="font-size:40px;margin:0">💌</p><h3 style="color:var(--ink)">Bạn chưa có thiệp nào</h3><p>Tạo thiệp đầu tiên — miễn phí, xem trước ngay khi gõ.</p><button class="btn" onclick="newCard()">Tạo thiệp đầu tiên</button></div>`;
    return;
  }
  el.innerHTML = cards.map(c => `
    <article class="item panel" data-id="${c.id}">
      <a class="thumb" href="/sua/${c.id}" style="background-image:url('${esc(c.cover ? c.cover.split('#')[0] : `/demo/cover-${c.template}-${c.palette}.jpg`)}');background-position:${c.cover ? 'center' : 'top'}"></a>
      <div class="info">
        <div class="top">
          <div style="min-width:0"><h3>${esc(c.names || c.title)}</h3><div class="link">${esc(c.title)} · ${esc(tplName(c.template))}${c.date ? ' · ' + c.date.split('-').reverse().join('/') : ''}</div></div>
          <a class="btn sm" href="/sua/${c.id}">Sửa thiệp</a>
        </div>
        <div class="meta">${stateChip(c)}${ledChip(c)}</div>
        ${trialBar(c)}${upgradeBar(c)}
        <div class="stats"><span>👁 <b>${c.views}</b> lượt xem</span><span>✉ <b>${c.guests}</b> khách mời</span><span>✓ <b>${c.rsvpYes}</b> người sẽ đến</span><span>♥ <b>${c.wishes}</b> lời chúc</span></div>
        <div class="acts">
          ${c.status === 'published' ? `<button class="btn sm soft" data-a="share">Sao chép link</button><a class="btn sm plain" target="_blank" href="${esc(c.url)}">Mở thiệp</a>` : ''}
          ${!c.paid ? `<button class="btn sm plain" data-a="pay">Kích hoạt · ${money(META.price)}</button>` : ''}
          ${c.led.created ? `<a class="btn sm plain" href="/sua-led/${c.id}">✨ Màn LED</a>` : ''}
          ${c.video.created && isCombo(c) ? `<a class="btn sm plain" href="/sua-video/${c.id}">🎬 Video</a>` : ''}
          <details class="more"><summary class="btn sm plain" aria-label="Thêm">⋯</summary><div><button data-a="dup">Nhân bản thiệp</button><button data-a="del" class="danger">Xoá thiệp</button></div></details>
        </div>
      </div>
    </article>`).join('');
  $$('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a, b.closest('.item').dataset.id, cards.find(c => c.id === b.closest('.item').dataset.id)));
}
// menu ⋯: mở cái này thì đóng cái khác; sát mép trái màn hình (điện thoại) thì mở sang phải; bấm ra ngoài thì đóng
document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d.matches || !d.matches('details.more') || !d.open) return;
  $$('details.more[open]').forEach((o) => { if (o !== d) o.open = false; });
  d.classList.remove('flip');
  if (d.querySelector('div').getBoundingClientRect().left < 8) d.classList.add('flip');
}, true);
document.addEventListener('click', (e) => { if (!e.target.closest('details.more')) $$('details.more[open]').forEach((o) => { o.open = false; }); });

// danh sách video cưới: mỗi đám cưới (thiệp) một video
function videoChip(v) {
  return v.paid ? '<span class="chip ok">● Đã kích hoạt</span>' : v.expired ? '<span class="chip red">Hết hạn dùng thử</span>'
    : `<span class="chip warn">Dùng thử · còn ${Math.max(0, Math.ceil((v.trialEndsAt - Date.now()) / 864e5))} ngày</span>`;
}
function loadVideos(cards, el) {
  const vids = cards.filter((c) => c.video.created);
  if (!vids.length) {
    el.innerHTML = `<div class="panel empty"><p style="font-size:40px;margin:0">🎬</p><h3 style="color:var(--ink)">Bạn chưa có video cưới nào</h3><p>Chọn một mẫu, chèn ảnh và chữ — video tự dựng, xem thử miễn phí.</p><a class="btn" href="/video-cuoi">Chọn mẫu video</a></div>`;
    return;
  }
  const tname = (id) => ((META.video.templates || []).find((t) => t.id === id) || {}).name || 'Video';
  el.innerHTML = vids.map((c) => `
    <article class="item vitem panel" data-id="${c.id}">
      <a class="thumb" href="/sua-video/${c.id}" style="background-image:url('/demo/vposter-${esc(c.video.template || 'sen')}.jpg')"></a>
      <div class="info">
        <div class="top">
          <div style="min-width:0"><h3>${esc(c.video.kind || 'Video cưới')} · ${esc(c.names || c.title)}</h3><div class="link">Mẫu ${esc(tname(c.video.template))}</div></div>
          <a class="btn sm" href="/sua-video/${c.id}">Sửa video</a>
        </div>
        <div class="meta">${videoChip(c.video)}</div>
        <div class="acts">
          <button class="btn sm soft" data-a="vshare">Chép link chiếu TV</button><a class="btn sm plain" target="_blank" href="${esc(c.video.url)}">Mở trình chiếu</a>
          ${c.video.paid ? (c.video.mp4 ? `<a class="btn sm plain" href="${esc(c.video.mp4)}" download>⬇ Tải MP4</a>` : '') : `<button class="btn sm plain" data-a="vpay">Kích hoạt · ${money(META.videoPrice)}</button>`}
        </div>
      </div>
    </article>`).join('');
  $$('[data-a]').forEach((b) => b.onclick = () => act(b.dataset.a, b.closest('.item').dataset.id, cards.find((c) => c.id === b.closest('.item').dataset.id)));
}

async function act(a, id, c) {
  try {
    if (a === 'share') copyText(c.url, 'Đã sao chép link thiệp');
    if (a === 'vshare') copyText(c.video.url, 'Đã chép link — mở trên Smart TV hoặc máy tính nối TV');
    if (a === 'vpay') openPayModal(id, load, 'video');
    if (a === 'pay') openPayModal(id, load);
    if (a === 'combo') openPayModal(id, load, 'combo');
    if (a === 'dup') { await api(`/api/cards/${id}/duplicate`, { method: 'POST' }); toast('Đã nhân bản thiệp'); load(); }
    if (a === 'del') {
      if (!confirm(`Xoá thiệp "${c.names || c.title}"? Danh sách khách, xác nhận và lời chúc của thiệp này cũng bị xoá và không khôi phục được.`)) return;
      await api(`/api/cards/${id}`, { method: 'DELETE' });
      toast('Đã xoá thiệp');
      load();
    }
  } catch (e) { toast(e.message, true); }
}

async function create(template, palette) {
  const { card } = await api('/api/cards', { method: 'POST', body: { template, palette } });
  location.href = '/sua/' + card.id;
}

// Chọn mẫu ở trang bộ sưu tập (ảnh bìa, bộ lọc, đổi màu); "Dùng mẫu →" quay lại đây với ?tao=<mẫu>&mau=<màu>
window.newCard = function () {
  location.href = '/mau-thiep?chon=1';
};

(async () => {
  const { meta, user } = await renderTopbar(VIDEOS ? 'videos' : 'cards');
  META = meta;
  // "Dùng mẫu" khi chưa đăng nhập: vào thẳng trình sửa với thiệp nháp (đăng nhập sau, lúc cần lưu / tải ảnh / gửi khách)
  const tao = new URLSearchParams(location.search).get('tao');
  if (!user && tao) return create(tao, new URLSearchParams(location.search).get('mau')).catch(() => (location.href = '/dang-nhap?next=' + encodeURIComponent(location.pathname + location.search)));
  if (!user) return (location.href = '/dang-nhap?next=' + encodeURIComponent(location.pathname + location.search));
  document.title = (VIDEOS ? 'Video của tôi — ' : 'Thiệp của tôi — ') + meta.brand;
  if (VIDEOS) {
    $('#pageTitle').textContent = 'Video của tôi';
    $('#pageSub').textContent = 'Video cưới chiếu TV — sửa ảnh, chữ, tải MP4';
    $('#newBtn').textContent = '+ Tạo video mới';
    $('#newBtn').onclick = () => (location.href = '/video-cuoi');
  } else $('#newBtn').onclick = newCard;
  const q = new URLSearchParams(location.search);
  if (q.get('tao')) return create(q.get('tao'), q.get('mau'));
  const want = q.get('tao-led') ? 'sua-led' : q.get('tao-video') ? 'sua-video' : null;
  if (want) {
    // từ trang giới thiệu sản phẩm: dùng thiệp gần nhất, chưa có thì tạo thiệp mới
    const { cards } = await api('/api/cards');
    // từ trang "Video cưới": mang theo mẫu đã chọn sang trình sửa
    // từ hàng "Top 5 màn hình LED" ở trang chủ: mang theo bảng màu + hiệu ứng đã chọn
    const mau = want === 'sua-video' && q.get('mau') ? `?mau=${encodeURIComponent(q.get('mau'))}`
      : want === 'sua-led' && q.get('palette') ? `?palette=${encodeURIComponent(q.get('palette'))}&effect=${encodeURIComponent(q.get('effect') || '')}` : '';
    if (cards[0]) return (location.href = `/${want}/${cards[0].id}${mau}`);
    const { card } = await api('/api/cards', { method: 'POST', body: { template: 'dodam' } });
    return (location.href = `/${want}/${card.id}${mau}`);
  }
  load().catch(e => toast(e.message, true));
})();
</script>
</body>
</html>
