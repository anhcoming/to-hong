<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock icon tài khoản</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eeef;font-family:'Be Vietnam Pro',sans-serif;color:#2b2224;padding:24px}
.grid{display:grid;grid-template-columns:repeat(3,360px);gap:22px;justify-content:center}
.it h3{margin:0 0 8px;font-size:14px;text-align:center}
.top{display:flex;align-items:center;padding:8px 8px 8px 18px;border-radius:999px;background:#fff;box-shadow:0 6px 18px rgba(120,40,50,.08)}
.top .lg{font-family:'Dancing Script';font-size:26px;color:#c93a53;margin-right:auto}
.b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.a1{border:1px solid #eadfe1;color:#2b2224}
.a2{background:#fff0f2;color:#d6455d}
.a3{background:linear-gradient(135deg,#c93a53,#ef7d8d);color:#fff;box-shadow:0 6px 14px rgba(214,69,93,.3)}
.a4{border:1px solid #eadfe1;color:#d6455d}
.a5{background:#fff0f2;color:#d6455d}
.a6{border:1px solid #eadfe1;color:#2b2224;position:relative}.a6 i{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#2ea36b;box-shadow:0 0 0 2px #fff}
</style></head><body>
<div class="grid">
<div class="it"><h3>A · Hình người viền</h3><div class="top"><span class="lg">Cưới Nha ♥</span><span class="b a1"><svg width="21" height="21" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span></div></div>
<div class="it"><h3>B · Hình người, nền hồng nhạt</h3><div class="top"><span class="lg">Cưới Nha ♥</span><span class="b a2"><svg width="21" height="21" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span></div></div>
<div class="it"><h3>C · Hình người, nền đỏ</h3><div class="top"><span class="lg">Cưới Nha ♥</span><span class="b a3"><svg width="21" height="21" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span></div></div>
<div class="it"><h3>D · Hai người (cặp đôi)</h3><div class="top"><span class="lg">Cưới Nha ♥</span><span class="b a4"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="8.5" cy="8.5" r="3.2"/><circle cx="16" cy="9.5" r="2.7"/><path d="M2.5 20a6 6 0 0 1 12 0"/><path d="M14.5 14.6A5 5 0 0 1 21.5 19"/></svg></span></div></div>
<div class="it"><h3>E · Trái tim</h3><div class="top"><span class="lg">Cưới Nha ♥</span><span class="b a5"><svg width="21" height="21" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10z"/></svg></span></div></div>
<div class="it"><h3>F · Hình người + chấm xanh "đã đăng nhập"</h3><div class="top"><span class="lg">Cưới Nha ♥</span><span class="b a6"><svg width="21" height="21" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><i></i></span></div></div>
</div>
</body></html>
