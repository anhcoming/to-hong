<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Màn hình LED — Cưới Nha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.ebar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.ebar .back{text-decoration:none;color:var(--muted);font-size:20px;padding:4px 8px}
.ebar .tt{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.ebar h1{margin:0;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ebar .sub{display:flex;align-items:center;gap:10px;flex:none}
#acts{display:flex;gap:8px;flex:none}
.saved{font-size:13px;color:var(--muted)}
.layout{flex:1;display:grid;grid-template-columns:420px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:16px 16px 80px;background:var(--bg)}
.group{padding:16px;margin-bottom:14px}
.group h3{margin:0 0 12px;font-size:15px}
.group h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;cursor:pointer;font-size:13px}
.opt b{display:block;font-size:14px}
.opt span{color:var(--muted)}
.opt.on{border-color:var(--primary);background:var(--primary-soft)}
.ratio-ic{display:inline-block;border:2px solid currentColor;border-radius:3px;margin-right:6px;vertical-align:-2px}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--primary)}
.range{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.range input{accent-color:var(--primary);width:100%}
.range output{text-align:right;color:var(--muted);font-size:13px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stagewrap{background:#1a1416;display:grid;place-items:center;padding:24px;min-height:0;overflow:hidden;position:relative}
.screen{background:#000;box-shadow:0 20px 60px rgba(0,0,0,.5);border:10px solid #2b2326;border-radius:8px;max-width:100%;max-height:100%}
.screen iframe{width:100%;height:100%;border:0;display:block}
/* thanh chuyển cảnh dưới khung xem trước: bấm tên cảnh để nhảy tới, vạch dưới cùng chạy theo thời gian của cảnh */
.stagewrap{grid-template-rows:minmax(0,1fr) auto;gap:12px}
.scenes{display:flex;align-items:center;gap:6px;max-width:100%;min-width:0}
.sc-btn{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.sc-btn[data-sc=pause]{font-size:13px}
.sc-btn:hover{background:rgba(255,255,255,.22)}
.sc-list{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.sc-list::-webkit-scrollbar{display:none}
.sc{position:relative;flex:none;height:34px;padding:0 13px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#d9cfd1;font:600 13px var(--sans,system-ui);cursor:pointer;overflow:hidden;white-space:nowrap}
.sc.on{background:#fff;color:#1a1416}
.sc.on i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--primary);transform-origin:left;animation:scbar linear forwards}
.paused .sc.on i{animation-play-state:paused}
@keyframes scbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.layout[hidden]{display:none}
#introBox:not(:empty){flex:1;min-height:0;overflow:auto;padding:0 16px}
.intro{max-width:520px;margin:60px auto;padding:28px;text-align:center}
@media (max-width:600px){.intro{margin:20px auto 40px;padding:22px 18px}}
.tips{font-size:14px;margin:0;padding-left:18px;color:var(--muted)}
.tips li{margin-bottom:6px}
@media (max-width:900px){.layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.stagewrap{order:-1;padding:10px 8px 8px;gap:8px}.screen{border-width:3px;border-radius:6px}.side{padding:12px 12px 40px}}
/* điện thoại: dòng 1 = ← tên thiệp, dưới tên là hạn dùng thử + trạng thái lưu (chữ nhỏ, không viên thuốc);
   dòng 2 = ba nút chia đều bề ngang, nhãn ngắn — không nút nào bị cắt hay phải cuộn ngang */
@media (max-width:600px){
  .ebar{padding:8px 10px 10px;gap:8px 4px}
  .ebar .back{padding:2px 6px 2px 0;font-size:22px}
  .ebar .tt{flex-direction:column;align-items:flex-start;gap:1px}
  .ebar h1{font-size:16px;max-width:100%}
  .ebar .sub{gap:6px;font-size:12px}
  #chip .chip{background:none;border:0;padding:0;font-size:12px;font-weight:600}
  #chip:not(:empty)+.saved::before{content:"·";margin-right:6px;color:var(--muted)}
  .saved{font-size:12px}
  #acts{width:100%;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:6px}
  #acts:empty{display:none}
  #acts .btn{min-height:38px;padding:6px 4px;font-size:13px;justify-content:center;text-align:center;white-space:nowrap}
  .group{padding:14px;margin-bottom:10px}
}
.upspin{width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.45);border-top-color:#d6455d;animation:upspin .8s linear infinite}
@keyframes upspin{to{transform:rotate(360deg)}}

/* ===== trình sửa kiểu CapCut (giống trình sửa video): thanh trên · cột icon · bảng · khung xem · thanh cảnh ===== */
body{background:var(--bg)}
.sbar{display:flex;align-items:center;gap:10px;height:58px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.sbar .back{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:18px}
.sbar .back:hover{background:var(--primary-soft)}
.sbar .ttl{min-width:0}
.sbar h1{margin:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36vw}
.sbar .sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sbar .sp{flex:1}
.sbar #acts{display:flex;gap:6px;align-items:center}
.studio{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr)}
.studio[hidden]{display:none}
.studio .rail{display:none} /* chỉ còn một bảng (Mẫu) → bỏ cột icon */
.studio.locked{grid-template-columns:minmax(0,1fr)}.studio.locked .side{display:none} /* đã kích hoạt: mẫu chốt, không cần cột chọn mẫu */
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:16px 0 8px}.bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .2s} /* thanh tiến độ dựng MP4 */
/* thanh chọn khung màn ngay trên khung xem trước */
.studio .stagewrap{grid-template-rows:auto minmax(0,1fr) auto}
.rbar{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:12.5px}
.rbar>span{padding:0 8px 0 10px;color:var(--muted);font-weight:600;white-space:nowrap}
.rbar button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:0;border-radius:999px;background:none;color:var(--ink);font:600 12.5px/1 inherit;font-family:inherit;cursor:pointer}
.rbar button i{display:block;border:1.5px solid currentColor;border-radius:2px}
.rbar button:hover{background:rgba(127,127,127,.1)}
.rbar button.on{background:var(--primary);color:#fff}
.rail{display:flex;flex-direction:column;gap:4px;padding:10px 6px;border-right:1px solid var(--line);background:var(--surface)}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border:0;border-radius:12px;background:none;color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;line-height:1.2;cursor:pointer}
.rail button svg{width:21px;height:21px}
.rail button[hidden]{display:none}
.rail button:hover{color:var(--ink);background:rgba(127,127,127,.08)}
.rail button.on{color:var(--primary);background:var(--primary-soft)}
.studio .side{overflow:auto;padding:16px 16px 40px;border-right:1px solid var(--line);background:var(--surface)}
.side .phd{margin:2px 0 4px;font-size:17px;font-weight:800}
.side .pdesc{margin:0 0 14px;font-size:13px;color:var(--muted)}
.studio .group{padding:0;margin:0 0 18px;border:0;box-shadow:none;background:none}
.side .next{position:sticky;bottom:-40px;margin-top:8px;padding:10px 0 0;background:linear-gradient(transparent,var(--surface) 30%)}
.studio .stagewrap{background:color-mix(in srgb,var(--bg) 80%,#888 6%)}
[data-theme="dark"] .studio .stagewrap{background:#141012}
.studio .screen{border:0;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
/* thanh cảnh dưới khung xem: từng cảnh là một ô như dòng thời gian, vạch chạy theo thời gian của cảnh */
.studio .scenes{width:100%;max-width:980px;padding:10px 12px;border-radius:16px;background:var(--surface);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.studio .sc-btn{background:var(--primary-soft);color:var(--primary)}
.studio .sc-btn[data-sc=pause]{background:var(--primary);color:#fff}
.studio .sc{height:56px;min-width:104px;padding:0 14px;border-radius:12px;background:linear-gradient(135deg,#3a2326,#120b0c);color:#f3dfc4;font-size:12.5px;border:2px solid transparent}
.studio .sc.on{background:linear-gradient(135deg,#3a2326,#120b0c);color:#fff;border-color:var(--primary)}
/* thanh cảnh: ✕ / ＋ ẩn hiện cảnh, cảnh đang ẩn mờ đi, thanh chạy thời gian dưới cảnh đang chiếu, tốc độ cuối thanh */
.studio .sc{display:inline-flex;align-items:center;gap:8px}
.studio .sc.off{background:none;border:2px dashed var(--line);color:var(--muted)}
.sc em{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--primary);transform:scaleX(0);transform-origin:left}
.sc.on em{animation:scbar linear forwards}.paused .sc.on em{animation-play-state:paused}
.sc b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.14);font-size:11px;line-height:1;opacity:.7}
.sc b:hover{opacity:1;background:var(--primary);color:#fff}
.studio .sc.off b{background:var(--primary-soft);color:var(--primary);opacity:1}
.scspd{flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--muted);font-size:14px}.scspd input{width:90px;accent-color:var(--primary)}.scspd output{min-width:28px;font-size:12px;font-weight:700;color:var(--ink)}
.datepop{position:fixed;z-index:60;width:300px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 18px 50px rgba(120,40,50,.22)}
.datepop>b{display:block;margin-bottom:8px;color:var(--primary)}
.sws .sw{width:44px;height:44px}
.lmau{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lm{padding:6px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
.lm i{display:block;aspect-ratio:16/9;border-radius:9px;background:#111 center/cover;margin-bottom:6px}
.lm b{display:block;font-size:12.5px;padding:0 2px 2px}
.lm:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.lm.on{border-color:var(--primary);background:var(--primary-soft)}
.tips{color:var(--ink)}
@media (max-width:900px){
  .studio{display:flex;flex-direction:column;overflow:auto}
  .studio .stagewrap{order:1;flex:none}
  .rail{order:2;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;position:sticky;top:0;z-index:5}
  .rail button{flex:1;min-width:58px}
  .studio .side{order:3;border-right:0;overflow:visible}
  .sbar h1{max-width:46vw}
  .sbar .hide-xs{display:none}
}
/* điện thoại: thanh trên 2 dòng — dòng 1 ← tên + trạng thái, dòng 2 các nút chia đều (trước đây nút đè lên tên) */
@media (max-width:600px){
  .sbar{flex-wrap:wrap;height:auto;padding:8px 10px 10px;row-gap:8px}
  .sbar .ttl{flex:1}
  .sbar h1{max-width:78vw}
  .sbar .sp{display:none}
  .sbar #acts:not(:empty){flex-basis:100%}
}
</style>
</head>
<body>
<header class="sbar">
  <a class="back" id="back" href="/thiep-cua-toi" title="Quay lại">←</a>
  <div class="ttl"><h1 id="ttl">Màn hình LED</h1><div class="sub"><span id="ratioTxt"></span><span id="chip"></span><span class="saved" id="saved"></span></div></div>
  <span class="sp"></span>
  <span id="acts"></span>
</header>
<div class="studio" id="layout" hidden>
  <nav class="rail" id="rail"><button type="button" data-panel="hieu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span>Mẫu</span></button><button type="button" data-panel="chu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4.5h14V6M12 4.5v15M9 19.5h6"/></svg><span>Nội dung</span></button><button type="button" data-panel="man"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8 20h8M12 16.5V20"/></svg><span>Khung màn</span></button><button type="button" data-panel="chieu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5v13l11-6.5z"/></svg><span>Trình chiếu</span></button></nav>
  <div class="side" id="side"></div>
  <div class="stagewrap" id="stagewrap"><div class="rbar" id="rbar" aria-label="Khung màn hình"></div><div class="screen" id="screen"><iframe id="frame" title="Xem trước màn LED"></iframe></div>
    <div class="scenes" id="scenes" aria-label="Chuyển cảnh"><button class="sc-btn" data-sc="prev" aria-label="Cảnh trước">‹</button><button class="sc-btn" data-sc="pause" id="scPause" aria-label="Tạm dừng">❚❚</button><div class="sc-list" id="scList"></div><button class="sc-btn" data-sc="next" aria-label="Cảnh sau">›</button></div></div>
</div>
<div id="introBox"><div class="pageload" role="status"><i></i>Đang mở màn hình LED…</div></div>
<script src="/js/common.js"></script>
<script src="/js/pay.js"></script>
<script src="/js/led-editor.js"></script>
</body>
</html>
