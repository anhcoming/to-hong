<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Màn hình LED đám cưới — trình chiếu tên cô dâu chú rể, ngày cưới | Cưới Nha</title>
<meta name="description" content="Màn hình LED tiệc cưới với các mẫu kim tuyến bạc, sao rơi, sao băng, tuyết rơi, ngân hà, lụa satin: tên cô dâu chú rể, ngày cưới kèm âm lịch, bố mẹ hai bên, lời cảm ơn. Chọn mẫu, sửa chữ, gửi link cho nhà hàng là chiếu. Xem trước miễn phí.">
<meta property="og:title" content="Màn hình LED đám cưới — chọn mẫu, gửi link là chiếu">
<meta property="og:description" content="Tên hai bạn toả sáng trên màn tiệc: kim tuyến bạc, sao rơi, tuyết rơi, ngân hà, lụa satin. Xem trước miễn phí.">
<meta name="theme-color" content="#fffafa">
<meta property="og:image" content="https://cuoinha.com/demo/lposter-bac-dembac.jpg">
<meta property="og:url" content="https://cuoinha.com/man-hinh-led-dam-cuoi">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cưới Nha">
<meta property="og:locale" content="vi_VN">
<link rel="canonical" href="https://cuoinha.com/man-hinh-led-dam-cuoi">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/css/site.css">
<style>
/* Trang chỉ còn danh sách mẫu: bấm mẫu → lớp xem mẫu (site.js tplView) chạy thật, xem xong mới bấm "Dùng mẫu này" */
.lp{padding:110px 0 70px}
/* tiêu đề gọn kiểu trang Mẫu thiệp: chữ đậm căn trái + một dòng nhỏ */
.lhead{max-width:1080px;margin:0 auto}
.lhead h1{margin:0;font-family:var(--serif);font-weight:800;letter-spacing:-.02em;font-size:30px;line-height:1.2}
.lhead p{margin:4px 0 0;color:var(--muted);font-size:15px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1080px;margin:30px auto 0;text-align:left}
.lcard{all:unset;position:relative;cursor:pointer;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:0 12px 30px rgba(120,40,50,.07);transition:transform .25s,box-shadow .25s}
.lcard:hover{transform:translateY(-4px);box-shadow:0 22px 44px rgba(120,40,50,.14)}
.lcard:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.lcard .pic{position:relative;aspect-ratio:16/9;background:#05070f}
.lcard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.lcard .pic::after{content:"▶";position:absolute;z-index:1;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;background:rgba(5,7,15,.55);color:#fff;font-size:15px;opacity:0;transition:opacity .2s}
.lcard:hover .pic::after{opacity:1}
.lcard b{position:absolute;left:0;right:0;bottom:0;display:block;padding:34px 16px 12px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.62));color:#fff;font-size:18px;font-weight:800;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.35)} /* tên mẫu đè lên góc dưới ảnh, như thẻ mẫu thiệp */
@media (max-width:900px){.lp{padding:96px 0 50px}}
@media (max-width:600px){
  .lp{padding:66px 0 24px}.lhead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} /* như trang Mẫu thiệp: ẩn tiêu đề (vẫn cho Google đọc) */
  .lgrid{grid-template-columns:1fr;gap:10px;margin-top:0} /* điện thoại: mỗi mẫu một hàng cho to */
  .lcard{border-radius:12px}
  .lcard b{padding:30px 14px 11px;font-size:17px}
  .lcard .pic::after{display:none}
}
/* tên mẫu nằm dưới ảnh (như thẻ mẫu thiệp), không đè lên poster — 27/11 */
.lcard{overflow:visible;background:none;border:0;box-shadow:none;border-radius:0}
.lcard:hover{transform:none;box-shadow:none}.lcard:hover .pic{transform:translateY(-3px);box-shadow:0 16px 34px rgba(120,40,50,.16)}
.lcard .pic{border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 22px rgba(120,40,50,.08);transition:transform .25s,box-shadow .25s}
.lcard b{position:static;padding:8px 2px 0;background:none;color:var(--ink);font-size:14.5px;font-weight:700;text-shadow:none}
@media (max-width:600px){.lcard{border-radius:0}.lcard .pic{border-radius:12px}.lcard b{padding:7px 2px 0;font-size:14px}}
</style>
</head>
<body data-page="led">
<header id="nav"></header>

<section class="lp"><div class="wrap">
  <div class="lhead"><h1>Mẫu màn hình LED</h1><p>7 mẫu · bấm để xem thử, ưng thì bấm Dùng mẫu</p></div>
  <div class="lgrid" id="lgrid" aria-label="Mẫu màn LED — bấm để xem"></div>
</div></section>

<footer id="foot"></footer>
<script src="/js/site.js"></script>
<script>
// Mẫu màn LED (cùng danh sách lib/led.js TEMPLATES) — bấm mẫu: lớp xem mẫu chạy thật, trong đó có nút "Dùng mẫu này"
(function () {
  var T = [
    ['bac', 'dembac', 'Đêm kim tuyến bạc'],
    ['lam', 'saoroi', 'Sao rơi'],
    ['bac', 'saobang', 'Đêm sao băng'],
    ['dong', 'tuyet', 'Tuyết rơi đêm đông'],
    ['tham', 'thienha', 'Dải ngân hà'],
    ['sondo', 'satindo', 'Lụa satin đỏ'],
    ['ngabac', 'satinnga', 'Lụa satin ngà'],
  ];
  var q = function (t) { return 'palette=' + t[0] + '&effect=' + t[1]; };
  var g = document.getElementById('lgrid');
  g.innerHTML = T.map(function (t, i) {
    return '<a class="lcard" data-i="' + i + '" href="/led/demo?' + q(t) + '" aria-label="Xem mẫu ' + t[2] + '"><span class="pic"><img src="/demo/lposter-' + t[0] + '-' + t[1] + '.jpg" alt="Màn hình LED đám cưới mẫu ' + t[2] + '" loading="lazy"></span><b>' + t[2] + '</b></a>';
  }).join('');
  g.addEventListener('click', function (e) {
    var a = e.target.closest('.lcard'); if (!a || !window.tplView || e.metaKey || e.ctrlKey) return; // không có lớp xem: mở trang xem như link thường
    e.preventDefault();
    var t = T[+a.dataset.i];
    tplView({ name: t[2], wide: true, src: '/led/demo?preview=1&' + q(t), use: '/tao-led?' + q(t) });
  });
})();
</script>
</body>
</html>
