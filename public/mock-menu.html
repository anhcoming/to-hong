<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock menu ☰</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap">
<style>
body{margin:0;background:#eee;font-family:'Be Vietnam Pro',sans-serif;padding:20px}*{box-sizing:border-box}
.row{display:grid;grid-template-columns:repeat(4,340px);gap:24px;justify-content:center}
.col h3{margin:0 0 8px;font-size:15px;text-align:center}
.ph{position:relative;width:340px;height:640px;border-radius:28px;overflow:hidden;background:linear-gradient(#fff 0 120px,#fdf3f4 120px);box-shadow:0 10px 30px rgba(0,0,0,.15)}
.dim{position:absolute;inset:0;background:rgba(20,10,14,.45);backdrop-filter:blur(2px)}
.card{position:absolute;left:10px;right:10px;top:10px;background:#fff;border-radius:22px;box-shadow:0 16px 40px rgba(0,0,0,.25);overflow:hidden}
.top{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-bottom:1px solid #f0e4e6}
.top .lg{font-family:'Dancing Script',cursive;font-size:24px;color:#c93a53;font-weight:700;margin-right:auto}
.top .mine{padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#c93a53,#ef7d8d);color:#fff;font-weight:700;font-size:13px}
.top .x{width:36px;height:36px;border-radius:50%;border:1px solid #eee;display:grid;place-items:center;font-size:18px}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.free{font-style:normal;padding:2px 8px;border-radius:999px;background:#d6455d;color:#fff;font-size:10.5px;font-weight:700}
.acct{display:flex;justify-content:space-around;padding:10px 6px 12px;border-top:1px solid #f0e4e6;font-size:13px;color:#888}
.acct span{display:flex;align-items:center;gap:5px}
/* A */
.la{padding:6px 10px}
.la a{display:flex;align-items:center;gap:12px;padding:8px 4px;color:#222;font-weight:600;font-size:15px}
.la a+a{border-top:1px solid #f5ecee}
.la i{width:34px;height:34px;border-radius:10px;background:#ffe3e7;color:#d6455d;display:grid;place-items:center}
.la i svg{width:19px;height:19px}.la .ch{margin-left:auto;color:#bbb;width:16px;height:16px}.la .free{margin-left:auto}
/* B */
.lb{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.lb a{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px 12px;border-radius:16px;background:#fff5f5;color:#222;font-weight:600;font-size:14px}
.lb i{width:36px;height:36px;border-radius:11px;background:#ffe3e7;color:#d6455d;display:grid;place-items:center}
.lb i svg{width:20px;height:20px}.lb .free{position:absolute;top:12px;right:10px}
.lb a.hot{background:linear-gradient(135deg,#c93a53,#ef7d8d);color:#fff}.lb a.hot i{background:rgba(255,255,255,.22);color:#fff}.lb a.hot .free{background:#fff;color:#d6455d}
/* C */
.lc{padding:4px 20px 6px}
.lc a{display:flex;align-items:center;padding:13px 0;color:#222;font-size:18px;font-weight:600}
.lc a+a{border-top:1px solid #f3e8ea}.lc .free{margin-left:10px}.lc .ch{margin-left:auto;color:#ccc;width:18px;height:18px}
/* D */
.ld{padding:8px}
.ld a{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:12px;color:#222;font-weight:600;font-size:15px}
.ld a svg{width:20px;height:20px;color:#d6455d}.ld a.on{background:#fff0f2}.ld .free{margin-left:auto}
.ld .cta{margin:6px 4px 4px;display:block;text-align:center;padding:12px;border-radius:14px;background:linear-gradient(135deg,#c93a53,#ef7d8d);color:#fff;font-weight:700}
a{text-decoration:none}
</style></head><body>
<div class="row" id="row"></div>
<script>
var I={card:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/>',clap:'<path d="M4 10h16v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="m4 10-.6-3.2 15-3 .6 3.2"/><path d="m8.5 6.2 2 3.3M13.5 5.2l2 3.3"/>',slide:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/><path d="m10 8 4 2-4 2z"/>',led:'<rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8 20.5h8M12 16.5v4"/><path d="m12 7 .9 1.9 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.3z"/>',video:'<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10.5 5-3v9l-5-3"/>',book:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 8h6M9 11.5h4"/>',pen:'<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/>',moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',out:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/>'};
var s=function(k,c){return '<svg '+(c?'class="'+c+'" ':'')+'viewBox="0 0 24 24">'+(I[k]||'<path d="m9 6 6 6-6 6"/>')+'</svg>'};
var M=[['card','Thiệp cưới'],['clap','Video báo hỷ TikTok',1],['slide','Slide cưới'],['led','Màn hình LED'],['video','Video dạm ngõ'],['book','Sổ tay cưới']];
var F='<em class="free">Miễn phí</em>';
var acct='<div class="acct"><span>'+s('pen').replace('<svg','<svg width="15" height="15"')+'Sổ tay của tôi</span><span>'+s('moon').replace('<svg','<svg width="15" height="15"')+'Sáng / tối</span><span>'+s('out').replace('<svg','<svg width="15" height="15"')+'Đăng xuất</span></div>';
var V={
 'A · Danh sách gọn (icon + tên)':'<div class="la">'+M.map(m=>'<a><i>'+s(m[0])+'</i>'+m[1]+(m[2]?F:s('x','ch'))+'</a>').join('')+'</div>'+acct,
 'B · Lưới 2 cột':'<div class="lb">'+M.map(m=>'<a'+(m[2]?' class="hot"':'')+'><i>'+s(m[0])+'</i>'+m[1]+(m[2]?F:'')+'</a>').join('')+'</div>'+acct,
 'C · Chữ to, không icon':'<div class="lc">'+M.map(m=>'<a>'+m[1]+(m[2]?F:'')+s('x','ch')+'</a>').join('')+'</div>'+acct,
 'D · Icon nét + nút Tạo thiệp':'<div class="ld">'+M.map((m,i)=>'<a'+(i==2?' class="on"':'')+'>'+s(m[0])+m[1]+(m[2]?F:'')+'</a>').join('')+'<a class="cta">Tạo thiệp miễn phí 7 ngày</a></div>'+acct
};
document.getElementById('row').innerHTML=Object.keys(V).map(k=>'<div class="col"><h3>'+k+'</h3><div class="ph"><div style=\"padding:150px 20px 0;font-weight:800;font-size:26px;line-height:1.25;color:#222\">Thiệp cưới online có tên từng khách</div><div class=\"dim\"></div><div class="card"><div class="top"><span class="lg">Cưới Nha ♥</span><span class="mine">Thiệp của tôi</span><span class="x">✕</span></div>'+V[k]+'</div></div></div>').join('');
</script>
</body></html>
