<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock màn chờ</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&amp;family=Dancing+Script:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
body{padding:24px 16px 60px}
.top{max-width:1240px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px}
.grid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:16px}
.card p{margin:0;font-size:13px;color:var(--muted)}
.card .btn{align-self:flex-start}
/* khung điện thoại giả: một trang sửa thiệp mờ phía sau */
.phone{position:relative;height:440px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.fake{padding:18px;display:flex;flex-direction:column;gap:12px}
.fake i{display:block;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.fake .h{height:26px;width:70%;background:var(--ink);opacity:.8;border:0}
.fake .row{display:flex;gap:8px}.fake .row i{height:30px;flex:1;border-radius:999px}
.fake .box{height:120px}.fake .box2{height:80px}
.fake .pills i{height:30px;width:90px;border-radius:999px;display:inline-block;margin-right:6px;background:var(--primary);opacity:.8;border:0}

/* ===== lớp chờ chung: mờ + tối nền, KHÔNG có hộp trắng ===== */
.ov{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:16px;background:rgba(18,10,12,.45);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);color:#fff;text-align:center}
.full .ov{position:fixed;z-index:999}
.lbl{font-weight:700;font-size:15px;letter-spacing:.01em;text-shadow:0 1px 8px rgba(0,0,0,.35)}

/* 1. Tim đập */
.v-heart svg{width:62px;height:62px;color:#ff8fa3;filter:drop-shadow(0 0 18px rgba(255,120,145,.55));animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}60%{transform:scale(1)}}

/* 2. Vòng xoay trần */
.v-ring .ring{width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,.22);border-top-color:#fff;border-right-color:#ff8fa3;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 3. Ba trái tim nhảy */
.v-dots .dots{display:flex;gap:12px}
.v-dots .dots b{width:16px;height:16px;background:#ff8fa3;transform:rotate(-45deg);position:relative;animation:hop 1s ease-in-out infinite}
.v-dots .dots b::before,.v-dots .dots b::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:inherit}
.v-dots .dots b::before{top:-8px;left:0}.v-dots .dots b::after{left:8px;top:0}
.v-dots .dots b:nth-child(2){animation-delay:.15s;background:#ffc2cd}.v-dots .dots b:nth-child(3){animation-delay:.3s;background:#fff}
@keyframes hop{0%,60%,100%{translate:0 0}30%{translate:0 -14px}}

/* 4. Thanh chạy trên cùng (gần như không che trang) */
.v-bar{background:rgba(18,10,12,.12);-webkit-backdrop-filter:none;backdrop-filter:none;align-content:start;place-items:start stretch}
.v-bar .track{position:absolute;top:0;left:0;right:0;height:4px;overflow:hidden;background:rgba(214,69,93,.15)}
.v-bar .track i{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,#d6455d,#ff8fa3,transparent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{left:-40%}to{left:100%}}
.v-bar .chip{position:absolute;top:14px;left:50%;translate:-50% 0;padding:6px 14px;border-radius:999px;background:#d6455d;color:#fff;font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(214,69,93,.35);display:flex;gap:8px;align-items:center}
.v-bar .chip::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}

/* 5. Đôi nhẫn */
.v-rings svg{width:96px;height:64px;overflow:visible}
.v-rings .r1{animation:ringL 1.6s ease-in-out infinite;transform-origin:36px 32px}
.v-rings .r2{animation:ringR 1.6s ease-in-out infinite;transform-origin:60px 32px}
@keyframes ringL{0%,100%{transform:translateX(-6px)}50%{transform:translateX(4px)}}
@keyframes ringR{0%,100%{transform:translateX(6px)}50%{transform:translateX(-4px)}}
.v-rings .gem{animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}

/* 6. Chữ lấp lánh */
.v-logo .word{font-family:var(--sans);font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;background:linear-gradient(100deg,rgba(255,255,255,.35) 30%,#fff 45%,#ff8fa3 52%,rgba(255,255,255,.35) 65%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.v-logo .lbl{font-weight:600;font-size:14px;opacity:.85}

@media (prefers-reduced-motion:reduce){.ov *,.ov *::before,.ov *::after{animation-duration:3s!important}}
</style>
</head>
<body>
<div class="top">
  <div><h1>Mock màn chờ</h1><p class="muted" style="margin:4px 0 0">6 kiểu, không có hộp trắng. Bấm "Xem toàn màn hình" để thử thật (tắt sau 3 giây).</p></div>
  <button class="btn plain sm" onclick="toggleTheme()">Đổi nền sáng / tối</button>
</div>
<div class="grid" id="grid"></div>

<script>
const HEART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.3-9.6C1.5 7.4 3.7 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.5 0 5.7 3.4 4.5 6.9-1.8 5-9.3 9.6-9.3 9.6z" fill="currentColor" fill-opacity=".25"/></svg>';
const RINGS = '<svg viewBox="0 0 96 64"><g class="r1"><circle cx="36" cy="34" r="20" fill="none" stroke="#ffd27a" stroke-width="5"/></g><g class="r2"><circle cx="60" cy="34" r="20" fill="none" stroke="#fff" stroke-width="5"/><path class="gem" d="M60 6l5 6-5 5-5-5z" fill="#ff8fa3"/></g></svg>';
const V = [
  { id: 'heart', name: '1. Tim đập', note: 'Trái tim thương hiệu đập nhẹ, chữ trắng bên dưới.', html: `${HEART}<div class="lbl">Đang tải…</div>` },
  { id: 'ring', name: '2. Vòng xoay trần', note: 'Vòng xoay trắng–hồng đặt thẳng trên nền mờ, gọn nhất.', html: '<div class="ring"></div><div class="lbl">Đang tải…</div>' },
  { id: 'dots', name: '3. Ba trái tim nhảy', note: 'Ba tim nhỏ nhảy lần lượt, vui mắt hơn.', html: '<div class="dots"><b></b><b></b><b></b></div><div class="lbl">Đang tải…</div>' },
  { id: 'bar', name: '4. Thanh chạy trên cùng', note: 'Chỉ một vạch chạy trên đầu và nhãn nhỏ, trang gần như không bị che.', html: '<div class="track"><i></i></div><div class="chip">Đang tải…</div>' },
  { id: 'rings', name: '5. Đôi nhẫn', note: 'Hai chiếc nhẫn khẽ lồng vào nhau, hợp chủ đề cưới.', html: `${RINGS}<div class="lbl">Đang tải…</div>` },
  { id: 'logo', name: '6. Chữ lấp lánh', note: 'Chữ CƯỚI NHA có vệt sáng lướt qua.', html: '<div class="word">Cưới Nha</div><div class="lbl">Đang tải…</div>' },
];
const fake = '<div class="fake"><i class="h"></i><div class="pills"><i></i><i></i></div><div class="row"><i></i><i></i><i></i></div><i class="box"></i><i class="box2"></i><i class="box2"></i></div>';
document.getElementById('grid').innerHTML = V.map((v) => `
  <div class="card">
    <div class="phone">${fake}<div class="ov v-${v.id}">${v.html}</div></div>
    <h3>${v.name}</h3><p>${v.note}</p>
    <button class="btn sm" data-full="${v.id}">Xem toàn màn hình</button>
  </div>`).join('');
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-full]'); if (!b) return;
  const v = V.find((x) => x.id === b.dataset.full);
  const w = document.createElement('div'); w.className = 'full';
  w.innerHTML = `<div class="ov v-${v.id}">${v.html}</div>`;
  document.body.appendChild(w); setTimeout(() => w.remove(), 3000);
});
</script>
</body>
</html>
