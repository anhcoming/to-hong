<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản trị</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&amp;family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0}
.stat{padding:16px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:26px;font-family:var(--serif);margin-top:2px}
</style>
</head>
<body>
<main class="wrap" style="padding-bottom:60px">
  <h1 style="font-family:var(--serif);font-weight:600;margin:28px 0 0">Quản trị</h1>
  <div class="stats" id="stats"></div>
  <section class="panel" style="padding:18px">
    <h3 style="margin:0 0 4px">Đơn kích hoạt</h3>
    <p class="muted" style="margin:0 0 12px;font-size:14px">Kiểm tra app ngân hàng: thấy tiền về với đúng nội dung (mã đơn) thì bấm <b>Xác nhận</b>.</p>
    <div style="overflow-x:auto" id="orders"></div>
  </section>
</main>
<script src="/js/common.js"></script>
<script>
async function load() {
  const { stats: s, orders } = await api('/api/admin/overview');
  $('#stats').innerHTML = [
    ['Doanh thu', money(s.revenue)], ['Thiệp đã bán', s.paid], ['Người dùng', s.users],
    ['Thiệp đã tạo', s.cards], ['Đang phát hành', s.published], ['Lượt xác nhận', s.rsvps],
  ].map(([l, v]) => `<div class="stat panel"><span>${l}</span><b>${v}</b></div>`).join('');
  $('#orders').innerHTML = orders.length ? `<table class="tbl"><thead><tr><th>Mã</th><th>Thiệp</th><th>Tài khoản</th><th>Số tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody>
    ${orders.map(o => `<tr>
      <td><b>${esc(o.code)}</b><br><span class="muted" style="font-size:12px">${fmtDateTime(o.createdAt)}</span></td>
      <td>${esc(o.card ? o.card.names || o.card.title : '(đã xoá)')}<br><span class="chip ${o.product === 'card' ? 'red' : o.product === 'led' ? 'warn' : 'ok'}">${esc(o.productName)}</span></td>
      <td>${esc(o.email || '')}</td>
      <td>${money(o.amount)}${o.coupon ? `<br><span class="chip">${esc(o.coupon)}</span>` : ''}</td>
      <td>${o.status === 'paid' ? `<span class="chip ok">Đã thanh toán</span>` : o.claimedAt ? `<span class="chip warn">Khách báo đã chuyển · ${fmtDateTime(o.claimedAt)}</span>` : '<span class="chip">Chờ thanh toán</span>'}</td>
      <td>${o.status === 'paid' ? '' : `<button class="btn sm" data-ok="${o.id}" data-code="${esc(o.code)}" data-amt="${o.amount}">Xác nhận</button>`}</td>
    </tr>`).join('')}</tbody></table>` : '<p class="empty">Chưa có đơn nào.</p>';
  $$('[data-ok]').forEach(b => b.onclick = async () => {
    if (!confirm(`Xác nhận đã nhận ${money(b.dataset.amt)} với nội dung ${b.dataset.code}?`)) return;
    await api(`/api/admin/orders/${b.dataset.ok}/confirm`, { method: 'POST' });
    toast('Đã kích hoạt thiệp');
    load();
  });
}
(async () => {
  const { user, meta } = await renderTopbar();
  document.title = 'Quản trị — ' + meta.brand;
  if (!user) return (location.href = '/dang-nhap?next=/quan-tri');
  if (!user.isAdmin) { $('main').innerHTML = '<p class="empty">Bạn không có quyền vào trang này.</p>'; return; }
  load().catch(e => toast(e.message, true));
})();
</script>
</body>
</html>
