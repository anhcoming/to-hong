<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản trị</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:26px 0 6px}
.ahead h1{font-family:var(--serif);font-weight:600;margin:0;font-size:30px}
.alogin{max-width:380px;margin:12vh auto 0;padding:28px;display:grid;gap:12px}
.alogin h1{font-family:var(--serif);font-weight:600;margin:0;font-size:28px}
.alogin p{margin:0}
.alogin .err{color:var(--danger,#b3202f);font-size:14px}
.atabs{position:sticky;top:0;z-index:20;background:var(--bg);margin-bottom:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px}
.kpi span{font-size:12px;color:var(--muted);display:block}
.kpi b{display:block;font-family:var(--serif);font-size:26px;line-height:1.2;margin-top:2px}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.hot{border-color:var(--warn);background:var(--warn-soft)}
.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}
@media (max-width:860px){.charts{grid-template-columns:1fr}}
.chart{padding:16px}
.chart h3{margin:0 0 4px;font-size:15px}
.chart p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.chart svg{width:100%;height:170px;display:block}
.chart .bar{fill:var(--primary);opacity:.85}
.chart .bar:hover{opacity:1}
.chart .lbl{font-size:10px;fill:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools .input{max-width:280px}
.tools select.input{width:auto}
.wrapx{overflow-x:auto}
.tbl td .sub{font-size:12px;color:var(--muted)}
.tbl tr.off td{opacity:.55}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.prodrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.setgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:760px){.setgrid{grid-template-columns:1fr}}
.coupon{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;margin-bottom:8px;align-items:center}
.coupon .btn{height:44px;padding:0;font-size:20px;border-radius:12px}
.pw{font-family:ui-monospace,Consolas,monospace;font-size:22px;letter-spacing:.08em;background:#f6efe6;border-radius:10px;padding:12px;text-align:center;margin:12px 0}
</style>
</head>
<body>
<main class="wrap" style="padding-bottom:60px">
  <div class="ahead"><div><h1>Quản trị</h1><p class="muted" style="margin:4px 0 0" id="hello"></p></div><button class="btn sm plain" id="reload">↻ Làm mới</button></div>
  <nav class="tabs atabs" id="tabs">
    <button class="tab on" data-t="home">Tổng quan</button>
    <button class="tab" data-t="orders">Đơn hàng <span id="pendBadge"></span></button>
    <button class="tab" data-t="users">Người dùng</button>
    <button class="tab" data-t="cards">Thiệp & sản phẩm</button>
    <button class="tab" data-t="settings">Cài đặt</button>
    <button class="tab" data-t="audit">Nhật ký</button>
  </nav>
  <div id="view"><div class="skeleton" style="height:300px"></div></div>
</main>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
