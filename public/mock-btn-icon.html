<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock icon nút Thử ngay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&display=swap">
<style>
body{margin:0;padding:28px;background:#fdf5f6;font-family:'Be Vietnam Pro',sans-serif}
.g{display:grid;grid-template-columns:repeat(3,330px);gap:22px 28px;justify-content:center}
.it h3{margin:0 0 8px;font-size:14px;color:#2b2224}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border:0;border-radius:999px;font:700 18px 'Be Vietnam Pro';color:#fff;background:linear-gradient(135deg,#d6455d,#ef7d8d);box-shadow:0 14px 34px rgba(214,69,93,.35)}
.go svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.go .r{order:2}
</style></head><body>
<div class="g">
<div class="it"><h3>Hiện tại · Máy ảnh</h3><button class="go"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Thử ngay</button></div>
<div class="it"><h3>A · Lấp lánh (phép màu)</h3><button class="go"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>Thử ngay</button></div>
<div class="it"><h3>B · Ảnh + dấu cộng (thêm ảnh)</h3><button class="go"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="14" rx="2.5"/><circle cx="8" cy="9" r="1.5"/><path d="M3 15l4-4 4 4 2-2 4 4"/><path d="M20 3v6M17 6h6"/></svg>Thử ngay</button></div>
<div class="it"><h3>C · Mũi tên phía sau</h3><button class="go">Thử ngay<svg class="r" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
<div class="it"><h3>D · Trái tim</h3><button class="go"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10z"/></svg>Thử ngay</button></div>
<div class="it"><h3>E · Tải lên</h3><button class="go"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 19v-3"/></svg>Thử ngay</button></div>
</div>
</body></html>
