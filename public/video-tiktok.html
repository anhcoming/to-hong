<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video báo hỷ đăng TikTok miễn phí | Cưới Nha</title>
<meta name="description" content="Mẫu video báo hỷ đăng TikTok, Reels, Story miễn phí: chọn mẫu có sẵn, thả ảnh cưới, điền tên và ngày — có ngay video dọc kèm nhạc. Không cần đăng ký, ảnh không tải lên mạng.">
<meta property="og:title" content="Video báo hỷ đăng TikTok — miễn phí, có ngay trong 1 phút">
<meta property="og:description" content="Thả ảnh cưới, nhập tên và ngày — 5 kiểu video dọc kèm nhạc để báo tin vui.">
<meta property="og:image" content="https://cuoinha.com/demo/hoamoc-c1.webp">
<meta name="theme-color" content="#fffafa">
<meta property="og:url" content="https://cuoinha.com/video">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cưới Nha">
<meta property="og:locale" content="vi_VN">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Cưới Nha","item":"https://cuoinha.com/"},{"@type":"ListItem","position":2,"name":"Video báo hỷ","item":"https://cuoinha.com/video"}]}</script>
<link rel="canonical" href="https://cuoinha.com/video">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;family=Playfair+Display:ital,wght@0,500;1,500&amp;display=swap">
<link rel="stylesheet" href="/css/site.css">
<style>
/* kiểu CapCut: lưới mẫu có sẵn (mỗi mẫu tự chạy thử) → bấm "Dùng mẫu" mở popup thả ảnh + điền chữ (public/js/story.js) */
.vhead{padding:34px 0 8px;text-align:center}
.vhead h1{margin:8px 0 6px;font:900 clamp(28px,4vw,44px)/1.1 var(--sans,inherit);letter-spacing:-.02em}
.vhead h1 em{font-family:var(--script);font-style:normal;color:var(--red);font-weight:700}
.vhead p{margin:0 auto;max-width:620px;color:var(--muted)}
.free{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--red)}
.vchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:24px 0 6px}
.vchips button{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px/1 inherit;font-family:inherit;cursor:pointer}
.vchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;padding:18px 0 40px}
.tc{display:flex;flex-direction:column;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden;box-shadow:0 12px 30px rgba(120,40,50,.07);cursor:pointer;transition:transform .2s,box-shadow .2s}
.tc:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(120,40,50,.14)}
.tc .pv{position:relative;display:block;background:#1a1214}
.tc canvas{display:block;width:100%;aspect-ratio:9/16}
.tc .bd{position:absolute;top:10px;left:10px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;font-weight:700;backdrop-filter:blur(4px)}
.tc .bd.free2{left:auto;right:10px;background:var(--red)}
.tc .tb{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px 12px 14px}.tc .use{width:100%}
.tc .tb div{flex:1;min-width:0}.tc h3{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .use{flex:none;height:34px;padding:0 14px;border:0;border-radius:999px;background:var(--red);color:#fff;font:700 13px/1 inherit;font-family:inherit;cursor:pointer}
@media (max-width:600px){.tgrid{grid-template-columns:1fr 1fr;gap:12px}.tc .tb{padding:10px}}
/* popup dùng mẫu */
.um{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px}
.um-pv canvas{display:block;width:100%;aspect-ratio:9/16;border-radius:16px;background:#1a1214;box-shadow:0 14px 34px rgba(0,0,0,.18)}
.um-pv p{margin:8px 0 0;text-align:center;font-size:12.5px;color:#8a7d80}
.um h3{margin:0 0 6px;font-size:15px}
.um .row{margin-bottom:16px}
.um .drop{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;padding:12px;border:2px dashed #eadfe1;border-radius:14px;cursor:pointer;color:#7a6d70;font-size:14px;text-align:center}
.um .drop:hover,.um .drop.over{border-color:#d6455d;background:rgba(214,69,93,.04)}
.um .drop b{color:#2b2224}
.um .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.um .thumbs span{position:relative;width:52px;height:68px;border-radius:8px;background:#eee center/cover}
.um .thumbs span i{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#2b2224;color:#fff;font-style:normal;font-size:12px;line-height:20px;text-align:center;cursor:pointer}
.um .thumbs span em{position:absolute;left:3px;bottom:3px;padding:0 4px;border-radius:4px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;font-style:normal}
.um .g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.um label{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13px;font-weight:600}
.um input,.um select{width:100%;min-width:0;box-sizing:border-box;height:42px;padding:0 12px;border:1px solid #eadfe1;border-radius:11px;background:#fff;color:#2b2224;font:inherit;font-weight:500}
.um input:focus,.um select:focus{outline:none;border-color:#d6455d;box-shadow:0 0 0 3px rgba(214,69,93,.12)}
.um-bar{height:8px;border-radius:99px;background:rgba(214,69,93,.14);overflow:hidden}.um-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#e2586f,#c93a55);transition:width .3s}
@media (max-width:680px){.um{grid-template-columns:minmax(0,1fr);gap:14px}.um-pv{width:128px;margin:0 auto}.um-pv p{font-size:11.5px}}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:900px;margin:0 auto}
.steps3 div{padding:22px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center}
.steps3 b{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 10px;border-radius:50%;background:var(--red);color:#fff;font-size:18px}
.steps3 h3{margin:0 0 4px;font-size:17px}.steps3 p{margin:0;color:var(--muted);font-size:14px}
@media (max-width:720px){.steps3{grid-template-columns:1fr}}
</style>
</head>
<body data-page="baohy">
<header id="nav"></header>

<section class="block" style="padding-top:84px"><div class="wrap">
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Mẫu video báo hỷ đăng TikTok miễn phí</h1>
  <div class="vchips" id="chips"></div>
  <div class="tgrid" id="grid" aria-label="Mẫu video báo hỷ"></div>
</div></section>

<footer id="foot"></footer>
<script src="/js/site.js"></script>
<script src="/js/photoprep.js"></script>
<script src="/js/story.js"></script>
<script>
(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var set = function (pre, n, ext, cover) { var a = cover ? [cover] : []; for (var i = 1; i <= n; i++) a.push('/demo/' + pre + '-' + i + '.' + ext); return a; };
  // mẫu có sẵn = kiểu (story.js) + tông màu + nhạc + bộ ảnh mẫu
  var TPL = [
    { st: 'phongbi', tone: 'hong', name: 'Phong bì hồng', music: '/music/canon.mp3', mname: 'Canon in D', ph: set('hoamoc', 8, 'webp', '/demo/hoamoc-c1.webp') },
    { st: 'dienanh', tone: 'hong', name: 'Điện ảnh', music: '/music/air.mp3', mname: 'Air on the G String', ph: set('tim', 8, 'jpg') },
    { st: 'polaroid', tone: 'nau', name: 'Polaroid kỷ niệm', music: '/music/eine-kleine.mp3', mname: 'Eine kleine Nachtmusik', ph: set('nau', 8, 'jpg') },
    { st: 'toigian', tone: 'xanhduong', name: 'Tối giản xanh', music: '/music/blue-danube.mp3', mname: 'Sóng Danube xanh', ph: set('dodam', 8, 'jpg') },
    { st: 'songhy', tone: 'do', name: 'Song hỷ đỏ', music: '/music/wedding-march.mp3', mname: 'Hành khúc đám cưới', ph: set('longphung', 10, 'jpg', '/demo/longphung-cover.jpg') },
    { st: 'phongbi', tone: 'xanhla', name: 'Phong bì xanh lá', music: '/music/eine-kleine.mp3', mname: 'Eine kleine Nachtmusik', ph: set('xanhla', 9, 'jpg') },
    { st: 'toigian', tone: 'hong', name: 'Tối giản hồng', music: '/music/radetzky.mp3', mname: 'Hành khúc Radetzky', ph: set('hoamoc', 8, 'webp', '/demo/hoamoc-c1.webp') },
    { st: 'dienanh', tone: 'nau', name: 'Điện ảnh hoài niệm', music: '/music/clair-de-lune.mp3', mname: 'Clair de Lune', ph: set('toduyen', 7, 'webp') },
    { st: 'polaroid', tone: 'tim', name: 'Polaroid mộng mơ', music: '/music/waltz-flowers.mp3', mname: 'Valse những bông hoa', ph: set('xanhla', 9, 'jpg') },
    { st: 'songhy', tone: 'xanhngoc', name: 'Song hỷ xanh ngọc', music: '/music/hornpipe.mp3', mname: 'Alla Hornpipe', ph: set('songhy', 8, 'jpg') },
  ];
  var card = function (ph, d) {
    d = d || {};
    return { template: '', palette: '', data: { groom: { name: d.groom || 'Gia Huy' }, bride: { name: d.bride || 'Bảo Ngọc' }, date: d.date === undefined ? '2026-12-20' : d.date,
      events: [{ name: 'Tiệc cưới', time: d.time === undefined ? '18:00' : d.time, place: d.place === undefined ? 'Sảnh Ngọc Lan — Nhà hàng tiệc cưới' : d.place }], cover: ph[0], photos: ph.slice(1), music: d.music || '' } };
  };
  var NAMES = {}; (window.STORY_STYLES || []).forEach(function (s) { NAMES[s.id] = s.name; });

  // ---------- lưới mẫu ----------
  var filter = '';
  $('#chips').innerHTML = '<button class="on" data-f="">Tất cả</button>' + (window.STORY_STYLES || []).map(function (s) { return '<button data-f="' + s.id + '">' + s.name + '</button>'; }).join('');
  $('#grid').innerHTML = TPL.map(function (t, i) {
    return '<article class="tc" data-i="' + i + '" data-st="' + t.st + '"><span class="pv"><canvas width="216" height="384"></canvas><span class="bd">' + NAMES[t.st] + '</span><span class="bd free2">Miễn phí</span></span>'
      + '<div class="tb"><div><h3>' + esc(t.name) + '</h3><small>♪ ' + esc(t.mname) + ' · 3–10 ảnh</small></div><button class="use" type="button">Dùng mẫu</button></div></article>';
  }).join('');
  document.querySelectorAll('.tc').forEach(function (el) { var t = TPL[+el.dataset.i]; storyPlayer(el.querySelector('canvas'), card(t.ph), t.st, t.tone, 15); el.onclick = function () { openUse(t); }; });
  $('#chips').onclick = function (e) {
    var b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f;
    document.querySelectorAll('#chips button').forEach(function (x) { x.classList.toggle('on', x === b); });
    document.querySelectorAll('.tc').forEach(function (x) { x.hidden = !!filter && x.dataset.st !== filter; });
  };

  // ---------- ảnh của khách: thu nhỏ (cạnh dài 1600px), giữ trong máy ----------
  function shrink(file) {
    var make = window.createImageBitmap ? createImageBitmap(file) : Promise.reject();
    return make.then(function (bm) {
      var k = Math.min(1, 1600 / Math.max(bm.width, bm.height)), c = document.createElement('canvas');
      c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k); c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
      return new Promise(function (ok) { c.toBlob(function (b) { ok(URL.createObjectURL(b || file)); }, 'image/jpeg', 0.9); });
    }).catch(function () { return URL.createObjectURL(file); });
  }
  var mine = { files: [], urls: [], groom: '', bride: '', date: '', time: '', place: '' }; // giữ lại giữa các lần mở mẫu

  // ---------- popup dùng mẫu: thả ảnh + điền chữ, xem trước ngay, tạo video ----------
  function openUse(t) {
    if (window.storyCss) storyCss();
    var stopPv = null, timer = 0, busy = false;
    var musics = '<option value="' + t.music + '">' + esc(t.mname) + ' (nhạc của mẫu)</option>';
    openModal('<h2 style="margin:0 0 12px">' + esc(t.name) + '</h2><div class="um"><div class="um-pv"><canvas width="270" height="480" id="umPv"></canvas><p id="umHint">Xem trước — thả ảnh để thấy ảnh của bạn</p></div><div>'
      + '<div class="row"><h3>Ảnh cưới <small style="font-weight:500;color:#8a7d80">· 3–10 ảnh, ảnh đầu làm bìa</small></h3><label class="drop" id="umDrop"><input type="file" accept="image/*" multiple hidden id="umFiles"><b>＋ Chọn ảnh</b> hoặc kéo thả vào đây</label><div class="thumbs" id="umThumbs"></div></div>'
      + '<div class="row g2"><label>Chú rể<input id="umG" maxlength="30" placeholder="Gia Huy" autocomplete="off"></label><label>Cô dâu<input id="umB" maxlength="30" placeholder="Bảo Ngọc" autocomplete="off"></label></div>'
      + '<div class="row g2"><label>Ngày cưới<input id="umD" type="date"></label><label>Giờ tiệc<input id="umT" type="time"></label></div>'
      + '<div class="row"><label>Nơi tổ chức<input id="umP" maxlength="80" placeholder="Nhà hàng Hoa Hồng, Quận 7" autocomplete="off"></label></div>'
      + '<div class="row"><label>Nhạc nền<select id="umM">' + musics + '</select></label></div>'
      + '<div id="umGoBox"><button class="btn block lg" id="umGo">Tạo video</button></div>'
      + '<div id="umProg" hidden><div class="um-bar"><i id="umPg"></i></div><p id="umTx" style="font-size:13px;color:#8a7d80;margin:6px 0 0">Đang chuẩn bị…</p></div>'
      + '</div></div>', function (box, close) {
      box.style.width = 'min(780px,100%)';
      var tr = (((window.META || {}).music || {}).tracks || []).filter(function (x) { return x.file !== t.music; });
      $('#umM', box).innerHTML = musics + tr.map(function (x) { return '<option value="' + x.file + '">' + esc(x.name) + '</option>'; }).join('');
      $('#umG', box).value = mine.groom; $('#umB', box).value = mine.bride; $('#umD', box).value = mine.date; $('#umT', box).value = mine.time; $('#umP', box).value = mine.place;
      function data() {
        mine.groom = $('#umG', box).value.trim(); mine.bride = $('#umB', box).value.trim(); mine.date = $('#umD', box).value; mine.time = $('#umT', box).value; mine.place = $('#umP', box).value.trim();
        return { groom: mine.groom || (mine.urls.length ? 'Chú rể' : ''), bride: mine.bride || (mine.urls.length ? 'Cô dâu' : ''), date: mine.date || (mine.urls.length ? '' : undefined), time: mine.time || (mine.urls.length ? '' : undefined), place: mine.place || (mine.urls.length ? '' : undefined), music: $('#umM', box).value };
      }
      function preview() { // xem trước bằng ảnh / chữ của khách (chưa có ảnh thì dùng ảnh mẫu)
        if (stopPv) stopPv();
        stopPv = storyPlayer($('#umPv', box), card(mine.urls.length ? mine.urls : t.ph, data()), t.st, t.tone, 24);
        $('#umHint', box).textContent = mine.urls.length ? 'Xem trước bằng ảnh của bạn' : 'Xem trước — thả ảnh để thấy ảnh của bạn';
      }
      var later = function () { clearTimeout(timer); timer = setTimeout(preview, 450); };
      function thumbs() {
        $('#umThumbs', box).innerHTML = mine.urls.map(function (u, i) { return '<span style="background-image:url(\'' + u + '\')">' + (i === 0 ? '<em>Bìa</em>' : '') + '<i data-x="' + i + '">×</i></span>'; }).join('');
        $('#umDrop b', box).textContent = mine.urls.length ? '＋ Thêm ảnh (' + mine.urls.length + '/10)' : '＋ Chọn ảnh';
      }
      function add(list) {
        list = Array.prototype.filter.call(list, function (f) { return /^image\//.test(f.type); }).slice(0, 10 - mine.files.length);
        if (!list.length) return;
        Promise.all(list.map(shrink)).then(function (us) { mine.files = mine.files.concat(list); mine.urls = mine.urls.concat(us); thumbs(); preview(); });
      }
      $('#umFiles', box).onchange = function (e) { add(e.target.files); e.target.value = ''; };
      var drop = $('#umDrop', box);
      ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
      drop.addEventListener('drop', function (e) { add(e.dataTransfer.files); });
      $('#umThumbs', box).onclick = function (e) { var x = e.target.closest('[data-x]'); if (!x) return; var i = +x.dataset.x; mine.files.splice(i, 1); URL.revokeObjectURL(mine.urls[i]); mine.urls.splice(i, 1); thumbs(); preview(); };
      box.addEventListener('input', later); $('#umM', box).onchange = later;
      thumbs(); preview();
      $('#umGo', box).onclick = function () {
        if (busy) return;
        if (!mine.urls.length) { toast('Thả ít nhất 1 ảnh cưới nhé'); return; }
        if (!mine.groom || !mine.bride) { toast('Điền tên chú rể và cô dâu nhé'); (mine.groom ? $('#umB', box) : $('#umG', box)).focus(); return; }
        busy = true; if (stopPv) stopPv();
        $('#umGoBox', box).hidden = true; $('#umProg', box).hidden = false;
        var c = card(mine.urls, data());
        storyRender(c, function (p, label) { var b = $('#umPg', box), x = $('#umTx', box); if (b) b.style.width = Math.round(p * 100) + '%'; if (x) x.textContent = label + '… ' + Math.round(p * 100) + '%'; }, t.st, t.tone)
          .then(function (res) {
            close();
            storyResult(res, c, {
              tip: 'Mẹo: đăng kèm #baohy #thiepcuoi #cuoinha để nhiều người thấy hơn.',
              // chuyển bộ ảnh sang trang gợi ý thiệp (đọc ở /goi-y qua kho tạm "incoming", giống ảnh thả ở trang chủ)
              cta: { label: '💌 Làm thiệp cưới online với bộ ảnh này', go: function () {
                var P = window.PhotoPrep;
                (P && P.idb ? P.idb.set('incoming', mine.files.slice()).catch(function () {}) : Promise.resolve()).then(function () { location.href = '/goi-y'; });
              } },
            });
          })
          .catch(function (e) { close(); toast(e.message || 'Không dựng được video'); });
      };
    }, function () { if (stopPv) stopPv(); clearTimeout(timer); });
  }
})();
</script>
</body>
</html>
