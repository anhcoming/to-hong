<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Video cưới</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&amp;family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&amp;family=Hanken+Grotesk:wght@300..700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@500..700&amp;family=Playfair+Display:ital,wght@0,400..700;1,400..700&amp;display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
/* ô ảnh cố định: bấm ảnh để đổi, × xoá ảnh giữ ô, kéo thả đổi chỗ */
.vslots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vslot{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.vslot .vpic{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:rgba(127,127,127,.08) center/cover;cursor:pointer;color:var(--muted);font-size:22px;display:grid;place-content:center;justify-items:center}
.vslot .vpic small{font-size:11px}
.vslot .vre{position:absolute;left:6px;right:6px;bottom:6px;padding:5px 0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;opacity:0;transition:.2s}
.vslot:hover .vre,.vslot:focus-within .vre{opacity:1}
.vslot .vno{position:absolute;top:6px;left:6px;min-width:22px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:22px;text-align:center;pointer-events:none}
.vslot .vx{position:absolute;top:5px;right:5px;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#222;font-size:15px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.vslot .vx:hover{background:#fff;color:var(--danger,#c0392b)}
.vslot.empty{border:2px dashed var(--line)}
.vslot.up .vpic{opacity:.7}
.vslot .vspin{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:3px solid rgba(214,69,93,.25);border-top-color:#d6455d;animation:vspin .8s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}
.vslot.empty .vpic{background:none}
.vslot.add{display:grid;place-content:center;justify-items:center;gap:2px;cursor:pointer;color:var(--primary);font-size:24px;border:2px dashed var(--primary);background:var(--primary-soft)}
.vslot.add small{font-size:11px;font-weight:600}
.vslot[draggable=true]{cursor:grab}
@media (hover:none){.vslot .vre{opacity:1}}
/* chữ: mỗi cảnh một ô gõ, kiểu chữ từng dòng giấu sau "Aa Kiểu chữ" */
.stext{display:block;width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:15px/1.7 inherit;font-family:inherit;resize:none;overflow:hidden}
.stext:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.scene-acts{display:flex;gap:4px}
.lnk{border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;cursor:pointer}
.lnk:hover,.lnk.on{background:var(--primary-soft);color:var(--primary)}
.sstyle{margin-top:8px;padding:8px;border-radius:10px;background:rgba(127,127,127,.08);border:1px solid var(--line)}
.sstyle .ln{display:grid;grid-template-columns:minmax(0,1fr) auto 58px auto;gap:6px;align-items:center;padding:4px 2px;border:0;background:none;margin:0}
.sstyle .lt{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sstyle .lc{display:flex;align-items:center;gap:3px}

/* ô ảnh trình chiếu (mẫu Album kỷ niệm) */
.vthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.vthumb{position:relative;aspect-ratio:3/4;border-radius:10px;background:var(--soft,#f3eded) center/cover;overflow:hidden;border:1px solid var(--line,#eee)}
.vthumb>span{position:absolute;top:4px;left:4px;min-width:20px;padding:0 5px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:20px;text-align:center}
.vthumb>div{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;padding:4px;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent);opacity:0;transition:.2s}
.vthumb:hover>div,.vthumb:focus-within>div{opacity:1}
.vthumb button{width:24px;height:24px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#222;font-size:13px;cursor:pointer}
.vthumb.add{display:grid;place-content:center;justify-items:center;gap:2px;cursor:pointer;color:var(--primary,#d6455d);font-size:22px;border-style:dashed;background:none}
.vthumb.add small{font-size:11px}
@media (hover:none){.vthumb>div{opacity:1}}

body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.ebar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.ebar .back{text-decoration:none;color:var(--muted);font-size:20px;padding:4px 8px}
.ebar h1{margin:0;font-size:17px;flex:1;min-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{font-size:13px;color:var(--muted)}
.layout{flex:1;display:grid;grid-template-columns:480px minmax(0,1fr);min-height:0}
.side{overflow:auto;padding:16px 16px 80px;background:var(--bg)}
.group{padding:16px;margin-bottom:14px}
.group h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.group h3 small{font-weight:400;color:var(--muted);font-size:12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;cursor:pointer;font-size:12px}
.opt b{display:block;font-size:13px;margin-bottom:2px}
.opt span{color:var(--muted)}
.opt.on{border-color:var(--primary);background:var(--primary-soft)}
.opt i{display:block;aspect-ratio:16/9;border-radius:6px;margin-bottom:6px;background-size:cover!important;background-position:center!important}
.ln{padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:6px}
.ln-top{display:flex;gap:4px;align-items:center}
.ln-b{flex:none;width:32px;height:34px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;font-weight:600}
.ln-b:hover{background:var(--primary-soft);color:var(--primary)}
.ln-adv{display:none;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 2px 2px;font-size:12px;color:var(--muted)}
.ln.open .ln-adv{display:flex}
.ln.open [data-a=style]{background:var(--primary-soft);color:var(--primary)}
.stepn{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px}
.range{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.range input{accent-color:var(--primary)}
.ln input[type=text]{flex:1;min-width:0;padding:8px 10px;border:1px solid transparent;border-radius:8px;font-size:15px;background:transparent;color:inherit}
.ln input[type=text]:focus{outline:none;border-color:var(--primary)}
.ln .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ln select,.ln input[type=number]{padding:5px 6px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--surface)}
.ln input[type=number]{width:62px}
.ln input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;padding:1px;background:var(--surface)}
.ln .tools{display:flex;gap:4px}
.ln .tools button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--muted)}
.ln .tools button:hover{color:var(--primary);border-color:var(--primary)}
.scene{border-left:3px solid var(--gold);padding-left:12px;margin-bottom:18px}
.scene-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:14px}
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tokens button{border:1px dashed var(--gold);background:#fffaf2;color:#7a5a2a;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.stage{background:#1a1416;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;min-height:0;overflow:hidden}
#cv{width:100%;max-width:1100px;aspect-ratio:16/9;height:auto;border:8px solid #2b2326;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
.jump{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* thanh tua: phát/dừng, kéo để tua, vạch đánh dấu đầu mỗi cảnh chữ */
.scrub{display:flex;align-items:center;gap:12px;width:100%;max-width:1100px;color:#ddd;font-size:13px}
.scrub #pp{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:#1a1416;font-size:13px;font-weight:700;cursor:pointer}
.scrub .track{position:relative;flex:1;height:22px;display:flex;align-items:center}
.scrub input{width:100%;margin:0;accent-color:var(--primary);cursor:pointer}
.scrub .marks{position:absolute;left:0;right:0;top:50%;height:0;pointer-events:none}
.scrub .marks i{position:absolute;top:-9px;width:2px;height:18px;border-radius:2px;background:rgba(255,255,255,.5)}
.scrub #tm{flex:none;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.jump button{border:1px solid rgba(255,255,255,.2);background:transparent;color:#ddd;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.jump button:hover{background:rgba(255,255,255,.1)}
.layout[hidden]{display:none}
#introBox:not(:empty){flex:1;min-height:0;overflow:auto;padding:0 16px}
.intro{max-width:560px;margin:60px auto;padding:28px;text-align:center}
@media (max-width:600px){.intro{margin:20px auto 40px;padding:22px 18px}}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:16px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .2s}
@media (max-width:980px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}.stage{order:-1;padding:10px}.side{padding-bottom:40px}}
</style>
</head>
<body>
<header class="ebar">
  <a class="back" id="back" href="/thiep-cua-toi" title="Quay lại">←</a>
  <h1 id="ttl">Video cưới</h1>
  <span id="chip"></span>
  <span class="saved" id="saved"></span>
  <span id="acts"></span>
</header>
<div class="layout" id="layout" hidden>
  <div class="side" id="side"></div>
  <div class="stage">
    <canvas id="cv" width="1920" height="1080"></canvas>
    <div class="scrub" id="scrub"><button type="button" id="pp" aria-label="Tạm dừng">❚❚</button><div class="track"><input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Tua video"><div class="marks" id="marks"></div></div><span id="tm">0:00 / 0:00</span></div>
    <div class="jump" id="jump"></div>
  </div>
</div>
<div id="introBox"></div>
<script src="/js/common.js"></script>
<script src="/js/pay.js"></script>
<script src="/js/lunar.js"></script>
<script src="/vendor/mp4-muxer.js"></script>
<script src="/video/engine.js"></script>
<script src="/js/video-editor.js"></script>
</body>
</html>
