<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock: icon nút Thiệp của bạn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
/* MOCK: icon nét cho nút "Thiệp của bạn" (thay emoji 💌) — cùng kiểu nét với thanh tab dưới */
body{padding:28px;background:var(--bg)}
h1{margin:0 0 18px;font-size:22px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.c{padding:18px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.c h2{margin:0 0 12px;font-size:15px}
.b{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--primary);border-radius:999px;background:#fff;color:var(--primary);font:600 14px/1 var(--sans);white-space:nowrap}
.b em{font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--primary);color:#fff}
.b svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.m{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;margin-left:10px;border:1px solid var(--primary);border-radius:999px;color:var(--primary);font:700 13px var(--sans)}
.m svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.m em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--primary);color:#fff}
.c p{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
</style></head><body>
<h1>Icon cho nút "Thiệp của bạn" — chọn 1</h1>
<div class="g" id="g"></div>
<script>
const I = [
  ['A · Phong thư có tim', 'Thư mời cưới — gần nghĩa "thiệp" nhất (đề xuất)', '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/><path d="M12 17.6s-2.4-1.4-2.4-3a1.2 1.2 0 0 1 2.4-.4 1.2 1.2 0 0 1 2.4.4c0 1.6-2.4 3-2.4 3z" style="fill:currentColor;stroke:none"/>'],
  ['B · Chồng thiệp', 'Nhiều thiệp xếp chồng — hợp với "danh sách thiệp"', '<rect x="7" y="3" width="13" height="16" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/><path d="M13.5 13.2s-2.3-1.3-2.3-2.9a1.15 1.15 0 0 1 2.3-.4 1.15 1.15 0 0 1 2.3.4c0 1.6-2.3 2.9-2.3 2.9z" style="fill:currentColor;stroke:none"/>'],
  ['C · Thiệp dọc + tim', 'Một tấm thiệp dọc có trái tim ở giữa', '<rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M12 14.6s-3-1.8-3-3.8a1.5 1.5 0 0 1 3-.5 1.5 1.5 0 0 1 3 .5c0 2-3 3.8-3 3.8z"/><path d="M9 18h6"/>'],
  ['D · Hai trái tim', 'Đôi tim lồng nhau — cảm giác "của hai bạn"', '<path d="M9.5 19S3 15 3 10.2A3.6 3.6 0 0 1 9.5 8a3.6 3.6 0 0 1 6.5 2.2"/><path d="M15.5 21s-5-3-5-6.6a2.6 2.6 0 0 1 5-1 2.6 2.6 0 0 1 5 1c0 3.6-5 6.6-5 6.6z"/>'],
];
document.getElementById('g').innerHTML = I.map(([t, d, p]) => `<div class="c"><h2>${t}</h2><span class="b"><svg viewBox="0 0 24 24">${p}</svg>Thiệp của bạn<em>1</em> ▾</span><span class="m"><svg viewBox="0 0 24 24">${p}</svg><em>1</em></span><p>${d} · trái: máy tính, phải: điện thoại</p></div>`).join('');
</script>
</body></html>
