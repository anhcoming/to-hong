<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sửa thiệp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.ebar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);z-index:6}
.ebar .back{text-decoration:none;color:var(--muted);font-size:20px;padding:4px 8px}
.ebar h1{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{font-size:13px;color:var(--muted);white-space:nowrap}
.emain{flex:1;min-height:0;display:flex}
/* 6 nút công cụ: cột dọc bên trái (máy tính), thanh dưới cùng (điện thoại) */
.tools{flex:none;display:flex;flex-direction:column;gap:4px;width:88px;padding:12px 8px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.tools button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:8px 2px;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;line-height:1.2;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.tools button i{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .2s,color .2s}
.tools button svg{width:22px;height:22px}
.tools button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools button:hover i{background:rgba(214,69,93,.07)}
.tools button:hover{color:var(--ink)}
.tools button.on{color:var(--primary)}
.tools button.on i{background:var(--primary-soft)}
.tools button.on svg{stroke-width:2.1}
/* bảng mở từ nút công cụ */
.sheet{flex:none;width:400px;display:none;flex-direction:column;background:var(--bg);border-right:1px solid var(--line);min-height:0}
.sheet-open .sheet{display:flex}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px}
.sheet-h b{font-size:17px}
.sheet-h button{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);font-size:20px;cursor:pointer}
.sheet-body{flex:1;min-height:0;overflow:auto}
.pane{padding:8px 16px 40px}
.group{padding:16px;margin-bottom:12px}
.group h3{margin:0 0 12px;font-size:16px}
.group h3 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.scrim{display:none}
/* thiệp ở giữa: khung điện thoại trên máy tính */
.stage{flex:1;min-width:0;display:grid;place-items:center;align-content:center;gap:12px;padding:16px;background:#e9e2da;overflow:auto}
[data-theme="dark"] .stage{background:#1a1416}
.pvmode{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.pvmode button,.pvmode2 button{border:0;background:none;padding:7px 14px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;color:#5d4f4a;cursor:pointer;white-space:nowrap}
.pvmode button.on,.pvmode2 button.on{background:var(--primary);color:#fff}
.pvmode2{display:flex;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent);width:max-content;max-width:100%}
.pvmode2 button{color:var(--ink)}
.phone{width:400px;max-width:100%;height:min(820px,calc(100vh - 150px));border-radius:40px;background:#1d1517;padding:10px;box-shadow:0 30px 60px rgba(0,0,0,.2)}
.phone{position:relative}
.phone iframe{width:100%;height:100%;border:0;border-radius:31px;background:var(--surface)}
.phone iframe.buf{position:absolute;left:10px;top:10px;width:calc(100% - 20px);height:calc(100% - 20px);visibility:hidden;pointer-events:none}
.ev{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--surface)}
.ev-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photo{position:relative;aspect-ratio:3/4;border-radius:10px;background:#eee center/cover;border:1px solid var(--line)}
.photo button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.photo .mv{left:4px;right:auto}
.photo.up{display:grid;place-items:center}
.photo.up::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.35)}
.photo.up i,.spin{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid rgba(214,69,93,.25);border-top-color:#d6455d;animation:upspin .8s linear infinite;position:relative;z-index:1;vertical-align:middle}
.spin{width:14px;height:14px;border-width:2px}
@keyframes upspin{to{transform:rotate(360deg)}}
.drop{display:grid;place-items:center;aspect-ratio:3/4;border:2px dashed var(--line);border-radius:10px;cursor:pointer;color:var(--muted);font-size:13px;text-align:center;padding:6px;background:var(--surface)}
.drop:hover{border-color:var(--primary);color:var(--primary)}
.cover-box{display:flex;gap:14px;align-items:center}
.cover-box .photo{width:110px;flex:none}
.tplnow{margin:0 0 10px;font-size:14px}
.tgchips{display:flex;gap:6px;overflow-x:auto;margin:0 -4px 12px;padding:2px 4px;scrollbar-width:none}
.tgchips::-webkit-scrollbar{display:none}
.tgchips button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tgchips button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
.tplpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tplpick button{position:relative;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.tplpick img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:10px;border:2px solid var(--line);background:var(--bg2,#eee);display:block}
.tplpick span{font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tplpick button.on img{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.tplpick button.on span{color:var(--primary)}
.tplpick button.on::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;display:grid;place-items:center}
.pals{display:flex;gap:10px;flex-wrap:wrap}
.pals button{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer;font-size:13px}
.pals button.on{border-color:var(--primary)}
.pals i{width:22px;height:22px;border-radius:50%}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slug{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.slug span{padding:10px 0 10px 12px;color:var(--muted);font-size:14px;white-space:nowrap}
.slug input{border:0!important;box-shadow:none!important;padding-left:2px!important}
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sum{flex:1;min-width:110px;padding:14px;text-align:center}
.sum b{display:block;font-size:24px;font-family:var(--serif)}
.sum span{font-size:12px;color:var(--muted)}
@media (max-width:760px){
  .ebar{padding:8px 10px;gap:6px}
  .saved{font-size:11px}
  .ebar h1{font-size:16px}
  .emain{flex-direction:column-reverse}
  /* 6 ô không bao giờ tràn: nút rộng theo chữ (vừa màn 360px); máy để cỡ chữ lớn thì nhãn xuống tối đa 2 dòng */
  .tools{flex-direction:row;width:auto;justify-content:stretch;align-items:stretch;gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(31,26,27,.04);overflow:hidden}
  .tools button{flex:1 1 auto;min-width:0;justify-content:flex-start;padding:6px 0 4px;font-size:11px;line-height:1.15;gap:2px;letter-spacing:-.01em}
  .tools button span{white-space:normal;overflow-wrap:anywhere;text-wrap:balance}
  .tools button i{width:46px;max-width:100%;height:28px}
  .tools button svg{width:21px;height:21px}
  .ebar .back{padding:4px 4px 4px 0;font-size:19px}
  #pubArea{flex:none;display:flex;gap:6px}
  #pubArea .btn{padding:7px 12px;font-size:12.5px}
  .stage{padding:0;display:block}
  .pvmode{display:none}
  .phone{width:100%;height:100%;border-radius:0;padding:0;background:none;box-shadow:none}
  .phone iframe{border-radius:0}
  .phone iframe.buf{left:0;top:0;width:100%;height:100%}
  /* bảng trượt từ dưới lên, che một phần thiệp */
  .sheet{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:78vh;max-height:78dvh;border:0;border-radius:20px 20px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.25);z-index:30;animation:sheetUp .22s ease-out}
  .sheet-h{padding-top:10px}
  .sheet-h::before{content:"";position:absolute;left:50%;top:6px;translate:-50% 0;width:40px;height:4px;border-radius:4px;background:var(--line)}
  .sheet-body{padding-bottom:env(safe-area-inset-bottom)}
  .sheet-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:29}
  .grid2{grid-template-columns:1fr}
}
/* điện thoại rất hẹp / cỡ chữ lớn: nút gọn "Phát hành", nhãn "Đã lưu" thu thành ✓ để tên đôi còn chỗ */
.ebar .xs{display:none}
#pubArea .btn{gap:0}
@media (max-width:440px){
  .ebar .xl{display:none}.ebar .xs{display:inline}
  .saved.ok{font-size:0}
  .saved.ok::after{content:"✓";font-size:15px;font-weight:700;color:#2e9d5b}
  .tools button{font-size:10px}
  .tools button i{font-size:18px}
}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
</style>
</head>
<body>
<header class="ebar">
  <a class="back" href="/thiep-cua-toi" title="Về danh sách">←</a>
  <h1 id="ttl">Đang tải…</h1>
  <span class="saved" id="saved"></span>
  <span id="pubArea"></span>
</header>
<div class="emain">
  <nav class="tools" id="tools" aria-label="Công cụ">
    <button data-tab="tpl"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9.5h17M9.5 9.5v11"/></svg></i><span>Mẫu</span></button>
    <button data-tab="date"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5l5 5L9 20H4v-5z"/><path d="M12.5 6.5l5 5"/></svg></i><span>Thông tin</span></button>
    <button data-tab="media"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-4.5-4.5-8.5 8"/></svg></i><span>Ảnh &amp; nhạc</span></button>
    <button data-tab="gift"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6M12 8.5v12"/><path d="M12 8.5C10.5 5 7 4.5 7 6.8 7 8.5 12 8.5 12 8.5zM12 8.5c1.5-3.5 5-4 5-1.7 0 1.7-5 1.7-5 1.7z"/></svg></i><span>Mừng cưới</span></button>
    <button data-tab="guests"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 5.2a3.3 3.3 0 0 1 0 6.6M18 14.8c2 .7 3.2 2.5 3.5 5.2"/></svg></i><span>Khách</span></button>
    <button data-tab="more"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18.5" cy="12" r="1.3" fill="currentColor"/></svg></i><span>Thêm</span></button>
  </nav>
  <aside class="sheet" id="sheet" aria-label="Bảng công cụ">
    <div class="sheet-h"><b id="sheetTitle"></b><button id="sheetX" aria-label="Đóng">×</button></div>
    <div class="sheet-body" id="sheetBody"><div id="panes"></div></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="stage" id="prev">
    <div class="pvmode" id="pvMode" role="group" aria-label="Chế độ"><button data-m="edit" class="on">✎ Sửa trực tiếp</button><button data-m="view">👁 Xem như khách</button></div>
    <div class="phone"><iframe id="frame" title="Thiệp — bấm ảnh hoặc chữ để sửa"></iframe></div>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/pay.js"></script>
<script src="/js/editor.js"></script>
</body>
</html>
