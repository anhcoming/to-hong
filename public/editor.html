<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sửa thiệp — Cưới Nha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.ebar{flex:none;display:flex;align-items:center;gap:10px;height:58px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface);z-index:6}
.ebar .back{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:18px}
.ebar .back:hover{background:var(--primary-soft)}
.ebar .ttl{flex:1;min-width:0}
.ebar h1{margin:0;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ebar .sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.ebar .sub .dot{flex:none;width:6px;height:6px;border-radius:50%;background:#e0a33a}
.ebar .sub.ok .dot{background:#2f9e6a}
.ebar .sub #tplN:empty{display:none}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.ebar .btn.ghost{border-color:transparent;background:none;color:var(--primary)}.ebar .btn.ghost:hover{background:var(--primary-soft)}
#pubArea{display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap}
.emain{flex:1;min-height:0;display:flex}
/* 6 nút công cụ: cột dọc bên trái (máy tính), thanh dưới cùng (điện thoại) */
.tools{flex:none;display:flex;flex-direction:column;gap:4px;width:88px;padding:12px 8px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.tools button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:8px 2px;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;line-height:1.2;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.tools button i{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .2s,color .2s}
.tools button svg{width:22px;height:22px}
.tools button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools button:hover i{background:rgba(214,69,93,.07)}
.tools button:hover{color:var(--ink)}
.tools button.on{color:var(--primary)}
.tools button.on i{background:var(--primary-soft)}
.tools button.on svg{stroke-width:2.1}
/* bảng mở từ nút công cụ */
.sheet{flex:none;width:400px;display:none;flex-direction:column;background:var(--bg);border-right:1px solid var(--line);min-height:0}
.sheet-open .sheet{display:flex}
.sheet-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px}
.sheet-h b{font-size:17px}
.sheet-h button{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);font-size:20px;cursor:pointer}
.sheet-body{flex:1;min-height:0;overflow:auto}
.pane{padding:8px 16px 40px}
.group{padding:16px;margin-bottom:12px}
.group h3{margin:0 0 12px;font-size:16px}
.group h3 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.scrim{display:none}
/* thiệp ở giữa: khung điện thoại trên máy tính */
/* thiệp ở giữa: hiện đúng như khách mở trên web (không khung điện thoại); nút chế độ nổi phía trên */
.stage{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
[data-theme="dark"] .stage{background:#1a1416}
.phone{flex:1;min-height:0;width:100%}
.phone{position:relative}
.smp-note{position:absolute;z-index:3;top:10px;left:50%;translate:-50% 0;width:max-content;max-width:calc(100% - 24px);display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:999px;background:rgba(32,20,24,.82);color:#fff;font-size:12px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.smp-note[hidden]{display:none}
.smp-note button{flex:none;width:22px;height:22px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:14px;line-height:1;cursor:pointer}
.phone iframe{display:block;width:100%;height:100%;border:0;background:var(--surface)}
.phone iframe.buf{position:absolute;left:0;top:0;width:100%;height:100%;visibility:hidden;pointer-events:none}
.ev{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface)}
.ev-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;list-style:none}
.ev-h::-webkit-details-marker{display:none}
.ev-h::before{content:'›';font-size:20px;line-height:1;color:var(--muted);transition:transform .2s;flex:none}
.ev[open]>.ev-h::before{transform:rotate(90deg)}
.ev-h.flat::before{display:none}
.prof-chip{all:unset;cursor:pointer;color:#2f7d5b;font-weight:600;white-space:nowrap}.prof-chip:hover{text-decoration:underline}
@media (max-width:760px){#profL{display:none}}
/* tab "Các mục của thiệp" */
.sprog{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sprog>div{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden}.sprog i{display:block;height:100%;background:#2f7d5b;border-radius:99px}.sprog b{font-size:12.5px;white-space:nowrap}
.slist{display:grid;gap:6px}
.srow2{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.srow2[hidden]{display:none}
.sx{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;flex:none}
.sx.ok{background:#2f7d5b;color:#fff}.sx.miss{background:#e8932b;color:#fff}.sx.off{border:2px solid var(--line)}
.sname{all:unset;flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:1px}.sname[disabled]{cursor:default}
.sname b{font-size:13.5px;font-weight:600;color:var(--ink)}.sname small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sname:not([disabled]):hover b{color:var(--primary)}
.snew{font-style:normal;font-size:10px;font-weight:700;background:var(--primary);color:#fff;padding:1px 6px;border-radius:999px;margin-left:4px;vertical-align:1px}
.stg{all:unset;width:36px;height:21px;border-radius:999px;background:#d9cfd1;position:relative;cursor:pointer;flex:none;transition:background .15s}
.stg::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.stg.on{background:#2f7d5b}.stg.on::after{left:17px}
/* popup Thông tin chính: danh xưng, Ông/Bà, nút lễ có sẵn, lễ chính */
.rk{display:flex;gap:6px}.rk input{flex:1;min-width:0}.rk select{width:88px;flex:none}
.rk-s{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;margin-bottom:10px}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chips2 button{all:unset;cursor:pointer;padding:6px 11px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--primary) 45%,transparent);color:var(--primary);font-weight:600;font-size:12.5px}
.chips2 button:hover{background:var(--primary-soft)}
.qe-main{color:var(--muted)}.qe-main.on{background:var(--ink);color:#fff}
/* Trang phục */
.dr-c{display:flex;flex-wrap:wrap;gap:10px}
.dr-c button{all:unset;width:38px;height:38px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);position:relative}
.dr-c button.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--primary)}
.dr-c button.on::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;text-shadow:0 0 3px rgba(0,0,0,.6)}
.dr-own{width:38px;height:38px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-weight:700;position:relative;overflow:hidden}
.dr-own input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* Hỏi đáp */
.qa-r{position:relative;border:1px solid var(--line);border-radius:12px;padding:10px 34px 10px 10px;margin-top:8px;display:grid;gap:6px}
.qa-r input,.qa-r textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);resize:vertical}
.qa-r input{font-weight:600}
.qa-x{all:unset;position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}.qa-x:hover{background:var(--primary-soft);color:var(--primary)}
/* Ảnh khi gửi link */
.sh-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-bottom:12px}
.sh-imgs button{all:unset;aspect-ratio:1;border-radius:10px;background:#eee center/cover;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.sh-imgs button.on{box-shadow:0 0 0 3px var(--primary)}
.sh-pv{background:#e9f2ff;border-radius:14px;padding:12px;margin-top:6px}.sh-pv>span{font-size:11px;font-weight:700;color:#0068ff;text-transform:uppercase;letter-spacing:.04em}
.sh-b{background:#fff;border-radius:12px;overflow:hidden;max-width:300px;margin-top:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sh-im{height:150px;background:#ddd center/cover}
.sh-tx{padding:9px 12px;color:#1f1a1b}.sh-tx b{display:block;font-size:13.5px}.sh-tx small{display:block;color:#6f6668;font-size:12px}.sh-tx em{display:block;color:#0068ff;font-size:11.5px;font-style:normal;margin-top:3px}

.ev-s{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev-s b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-s small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-act{display:flex;gap:6px;flex:none}
.ev-b{padding:0 14px 14px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photo{position:relative;aspect-ratio:3/4;border-radius:10px;background:#eee center/cover;border:1px solid var(--line)}
.photo button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.photo .mv{left:4px;right:auto}
.photo.up{display:grid;place-items:center}
.photo.up::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.35)}
.photo.up i,.spin{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid rgba(214,69,93,.25);border-top-color:#d6455d;animation:upspin .8s linear infinite;position:relative;z-index:1;vertical-align:middle}
.spin{width:14px;height:14px;border-width:2px}
@keyframes upspin{to{transform:rotate(360deg)}}
.drop{display:grid;place-items:center;aspect-ratio:3/4;border:2px dashed var(--line);border-radius:10px;cursor:pointer;color:var(--muted);font-size:13px;text-align:center;padding:6px;background:var(--surface)}
.drop:hover{border-color:var(--primary);color:var(--primary)}
.cover-box{display:flex;gap:14px;align-items:center}
/* nhạc nền: danh sách nhạc mẫu, nghe thử + chọn */
.mlist{display:grid;gap:6px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mrow.on{border-color:var(--primary);background:var(--primary-soft)}
.mplay{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;cursor:pointer}
.mt{flex:1;min-width:0;display:grid;line-height:1.3}
.mt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnow{flex:none;font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap}
.cover-box .photo{width:110px;flex:none}
.tplnow{margin:0 0 10px;font-size:14px}
.tgchips{display:flex;gap:6px;overflow-x:auto;margin:0 -4px 12px;padding:2px 4px;scrollbar-width:none}
.tgchips::-webkit-scrollbar{display:none}
.tgchips button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tgchips button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
@media (max-width:600px){ /* điện thoại: thanh gạch chân */
  .tgchips{gap:0 16px;margin:0 0 12px;padding:0;border-bottom:1px solid var(--line)}
  .tgchips button{flex:none;height:auto;padding:10px 0;margin-bottom:-1px;border:0;border-bottom:2.5px solid transparent;border-radius:0;background:none;color:var(--muted);font-size:13px;font-weight:600}
  .tgchips button.on{background:none;color:var(--ink);border-bottom-color:var(--primary)}
}
.tplpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tplpick button{position:relative;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.tplpick img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:10px;border:2px solid var(--line);background:var(--bg2,#eee);display:block}
.tplpick span{font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tplpick button.on img{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.tplpick button.on span{color:var(--primary)}
.tplpick button.on::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;display:grid;place-items:center}
.pals{display:flex;gap:10px;flex-wrap:wrap}
.pals button{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer;font-size:13px}
.pals button.on{border-color:var(--primary)}
.pals i{width:22px;height:22px;border-radius:50%}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slug{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.slug span{padding:10px 0 10px 12px;color:var(--muted);font-size:14px;white-space:nowrap}
.slug input{border:0!important;box-shadow:none!important;padding-left:2px!important}
/* tổng số phản hồi: lưới 2 × 2 — bảng khách mời hẹp (tấm trượt điện thoại, cột studio máy tính) nên 4 ô một hàng bị gãy chữ */
.sumrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sum{padding:12px 8px;text-align:center;min-width:0}
.sum b{display:block;font-size:24px;font-family:var(--serif)}
.sum span{font-size:12px;color:var(--muted)}
/* danh sách khách / xác nhận tham dự: mỗi khách một dòng (tên + trạng thái bên trái, nút bên phải) thay cho bảng nhiều cột */
.glist{list-style:none;margin:0;padding:0}
.glist li{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.glist li:last-child{border-bottom:0;padding-bottom:0}
.glist .gm{flex:1;min-width:0}
.glist .gm>b{display:block;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.glist .gs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:5px;font-size:12px;color:var(--muted)}
.glist .chip{white-space:nowrap}
.glist .gn{margin:4px 0 0;font-size:13px;color:var(--muted);white-space:pre-line}
.glist .ga{flex:none;display:flex;align-items:center;gap:4px}
.btn[hidden]{display:none}
/* khung thiệp đang dựng (mở trình sửa, đổi mẫu): vòng xoay giữa khung, thiệp cũ mờ đi */
.pv-wait{position:absolute;inset:0;z-index:2;display:none;place-items:center;align-content:center;gap:12px;color:var(--muted);font-size:14px;font-weight:600;pointer-events:none;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.phone.wait .pv-wait{display:grid}
.pv-wait i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(214,69,93,.2);border-top-color:#d6455d;animation:upspin .8s linear infinite}
/* bấm chữ trên thiệp → ô tương ứng ở bảng trái sáng lên */
.field input.flash,.field textarea.flash{animation:fflash 1.1s ease}
@keyframes fflash{0%{background:#ffe1e7;box-shadow:0 0 0 4px rgba(214,69,93,.25)}100%{box-shadow:0 0 0 0 rgba(214,69,93,0)}}
/* ô sửa nhanh cho chữ không có trong bảng (lời mời, lời nhắn…): máy tính = đầu bảng trái; điện thoại = ngăn nhỏ dưới đáy */
.qe{flex:none;margin:6px 16px 4px;padding:12px 14px;border:1.5px solid var(--primary);border-radius:14px;background:var(--surface);box-shadow:0 0 0 4px rgba(214,69,93,.1)}
.qe-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.qe-h b{font-size:14px;color:var(--primary)}
.qe-x{border:0;border-radius:999px;padding:6px 14px;background:var(--primary);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.qe input,.qe textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.qe input:focus,.qe textarea:focus{border-color:var(--primary)}
/* cột "Các phần của thiệp" (màn rộng) */
.outl{flex:none;width:220px;padding:16px 10px;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto}
.outl[hidden]{display:none}
.outl h3{margin:0 0 10px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.outl button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:10px;font:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer}
.outl button:hover{background:var(--primary-soft)}
.outl button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.outl button i{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--bg);color:var(--muted);font:700 11px/1 var(--sans);font-style:normal}
.outl button.on i{background:var(--primary);color:#fff}
.outl button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1279px){.outl{display:none}}
@media (max-width:760px){
  .ebar{height:54px;padding:0 10px;gap:6px}
  .ebar .sub #tplN,.ebar .sub #tplN+.dot{display:none}
  .emain{flex-direction:column-reverse}
  /* 6 ô không bao giờ tràn: nút rộng theo chữ (vừa màn 360px); máy để cỡ chữ lớn thì nhãn xuống tối đa 2 dòng */
  .tools{flex-direction:row;width:auto;justify-content:stretch;align-items:stretch;gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(31,26,27,.04);overflow:hidden}
  .tools button{flex:1 1 auto;min-width:0;justify-content:flex-start;padding:6px 3px 4px;font-size:11px;line-height:1.15;gap:2px;letter-spacing:-.01em}
  .tools button span{white-space:normal;overflow-wrap:anywhere;text-wrap:balance}
  .tools button i{width:46px;max-width:100%;height:28px}
  .tools button svg{width:21px;height:21px}
  .ebar .back{width:30px}
  #pubArea .btn{padding:7px 12px;font-size:12.5px}
  .stage{padding:0;display:block}
  .phone{width:100%;height:100%;border-radius:0;padding:0;background:none;box-shadow:none}
  .phone iframe{border-radius:0}
  .phone iframe.buf{left:0;top:0;width:100%;height:100%}
  /* bảng trượt từ dưới lên, che một phần thiệp */
  .sheet{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:78vh;max-height:78dvh;border:0;border-radius:20px 20px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.25);z-index:30;animation:sheetUp .22s ease-out}
  .sheet-h{padding-top:10px}
  .sheet-h::after{content:"";flex:none;width:34px;order:-1} /* tiêu đề bảng (Mẫu & màu…) căn giữa như các bảng khác: chừa trái bằng nút ✕ */
  .sheet-h b{flex:1;text-align:center;font-size:19px}
  .sheet-h::before{content:"";position:absolute;left:50%;top:6px;translate:-50% 0;width:40px;height:4px;border-radius:4px;background:var(--line)}
  .sheet-body{padding-bottom:env(safe-area-inset-bottom)}
  /* bảng trượt lên: bỏ khung viền lồng bên trong, nội dung rộng sát lề bảng (đỡ thụt hai lớp) */
  .sheet .pane{padding:4px 14px 32px}
  .sheet .pane .group.panel{padding:0;border:0;background:none;box-shadow:none;border-radius:0}
  .sheet-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:29}
  .grid2{grid-template-columns:1fr}
  .qe{position:fixed;left:0;right:0;bottom:0;z-index:31;margin:0;border:0;border-radius:20px 20px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -14px 40px rgba(0,0,0,.22);animation:sheetUp .2s ease-out}
}
/* điện thoại rất hẹp / cỡ chữ lớn: nút gọn "Phát hành", nhãn "Đã lưu" thu thành ✓ để tên đôi còn chỗ */
.ebar .xs{display:none}
#pubArea .btn{gap:0}
@media (max-width:440px){
  .ebar .xl{display:none}.ebar .xs{display:inline}
  .saved.ok{font-size:0}
  .saved.ok::after{content:"✓";font-size:15px;font-weight:700;color:#2e9d5b}

  .tools button{font-size:10px}
  .tools button i{font-size:18px}
}
/* điện thoại: thanh trên một hàng gọn — ← · (Chưa lưu) · 👁 Xem trước · Gửi thiệp; bỏ tên cô dâu chú rể cho rộng chỗ */
@media (max-width:760px){
  .ebar .ttl{display:flex;align-items:center;gap:6px}
  .ebar .ttl h1{display:none}
  .ebar .sub{flex:none}
  .ebar .sub .dot{display:none}
  .ebar .saved.ok{display:none} /* đã lưu: không hiện ✓; chỉ hiện chữ khi "Chưa lưu" / đang tải ảnh */
  #pubArea{display:flex;align-items:center;gap:6px}
  #pubArea .btn.ghost{height:36px;min-height:0;padding:0 14px;justify-content:center;align-items:center;border-radius:999px;background:var(--primary-soft);font-size:14px}
  #pubArea .btn.ghost .xl{display:inline}
  #pubArea #sendBtn{height:36px;min-height:0;padding:0 16px;font-size:14px}
}
/* album ảnh (popup trên điện thoại + mục Album trên máy tính) */
.al-tip{margin:0 0 12px;font-size:13.5px}.al-cnt{color:var(--ink)}
.al-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;user-select:none}
.al-t{position:relative;aspect-ratio:3/4;border-radius:12px;background:#eee center/cover no-repeat;border:1px solid var(--line);cursor:grab;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .15s,box-shadow .15s}
.al-t.drag{opacity:.55;transform:scale(1.04);box-shadow:0 10px 26px rgba(0,0,0,.25);cursor:grabbing;z-index:2;pointer-events:none}
.al-t.up{cursor:default}
.al-n{position:absolute;left:6px;bottom:6px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font:700 12px/22px system-ui;font-style:normal;text-align:center}
.al-b{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.al-b button{width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;cursor:pointer;display:grid;place-items:center}
.al-b button:hover{background:var(--primary)}
.al-mv{position:absolute;left:6px;right:6px;bottom:6px;display:flex;justify-content:space-between;pointer-events:none}.al-mv button{pointer-events:auto;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#2b2224;font-size:20px;line-height:1;font-weight:700;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}.al-mv i{width:30px}
.al-t .al-n{z-index:2;left:50%;bottom:10px;translate:-50% 0} /* số thứ tự giữa đáy, hai bên là nút ‹ › */
.al-sp{position:absolute;inset:0;margin:auto;width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;animation:upspin .8s linear infinite}
.al-add{display:grid;place-content:center;text-align:center;aspect-ratio:3/4;border:2px dashed var(--line);border-radius:12px;cursor:pointer;color:var(--primary);font-weight:700;font-size:14px;background:var(--surface)}
.al-add small{color:var(--muted);font-weight:500;font-size:12px}
/* máy tính: bố cục studio — thiệp bên trái, danh sách mục gập / mở bên phải */
body.studio .tools,body.studio .outl,body.studio .scrim,body.studio .sheet-h{display:none}
body.studio .sheet{display:flex;order:2;width:min(520px,42vw);border-right:0;border-left:1px solid var(--line);background:var(--surface)}
body.studio .stage{order:1}
body.studio .pane{padding:0 0 60px}
.st-top{position:sticky;top:0;z-index:3;background:var(--surface);padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.st-top .sprog{margin:0}
.st-sec{border-bottom:1px solid var(--line);scroll-margin-top:52px}
.st-sec[hidden]{display:none}
.st-g{margin:0;padding:18px 20px 6px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.st-miss{color:#c77514!important}
.st-h{min-height:52px;box-sizing:border-box}
.st-add{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line)}
.st-add span{font-size:13px;font-weight:600;color:var(--muted);margin-right:2px}
.st-add button{all:unset;cursor:pointer;padding:5px 11px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--primary) 45%,transparent);color:var(--primary);font-weight:600;font-size:12.5px}
.st-add button:hover{background:var(--primary-soft)}
.st-h{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;list-style:none;user-select:none;transition:background .15s}
.st-h::-webkit-details-marker{display:none}
.st-h:hover{background:color-mix(in srgb,var(--primary-soft) 55%,transparent)}
.st-h::after{content:'';flex:none;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s;margin-left:2px}
.st-sec[open]>.st-h{background:var(--primary-soft)}
.st-sec[open]>.st-h::after{transform:rotate(-135deg) translate(-2px,-2px)}
.st-n{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.st-n b{font-size:14.5px;font-weight:650;color:var(--ink)}
.st-n small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-b{padding:16px 20px 22px;animation:stIn .18s ease-out}
.st-b h4{font-size:14px}
.st-b .group.panel{border:0;box-shadow:none;padding:0;margin:0;background:none}
.st-b .field select{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink);font:inherit}
.st-b .tplpick{max-height:330px;overflow:auto;padding:2px}
.ev-star{font-style:normal;color:#e0a100;font-size:15px;margin-right:2px}
.fxs{display:flex;flex-wrap:wrap;gap:6px}
.fxs button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink);background:var(--surface)}
.fxs button:hover{border-color:var(--primary)}
.fxs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* máy tính: cột chọn mẫu bên trái */
.tside{flex:none;order:0;width:300px;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:16px 14px 40px}
.tside[hidden],body:not(.studio) .tside{display:none}
.tside h3{margin:0;font-size:15px}.ts-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tside:not([hidden]){animation:tsIn .2s ease-out}@keyframes tsIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.tside .tplpick{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.tside{width:240px}}
/* máy tính: thiệp khung điện thoại bên trái, các mục là thẻ bên phải — giữ nét riêng của Cưới Nha:
   nền hồng phấn, viền hồng nhạt, bóng ấm, nút bo tròn, tiêu đề nhóm chữ viết tay, điểm nhấn màu hồng đậm */
.st-q{display:none}
body.studio .st-q{display:flex;align-items:center;gap:8px;flex:0 1 380px;height:36px;margin:0 auto;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);box-shadow:0 2px 10px rgba(120,40,50,.05)}
body.studio .st-q svg{width:15px;height:15px;flex:none;color:var(--primary)}
body.studio .st-q input{all:unset;flex:1;min-width:0;font-size:13.5px;color:var(--ink)}
body.studio .st-q input::placeholder{color:#b3a7a9}
body.studio .st-q:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
body.studio .ebar{background:rgba(255,250,250,.86);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);padding-left:max(16px,calc(50% - 540px));padding-right:max(16px,calc(50% - 540px))}
[data-theme="dark"] body.studio .ebar{background:rgba(26,20,22,.86)}
body.studio .ebar .ttl{flex:0 1 300px}
body.studio #sendBtn{background:var(--grad);border:0;box-shadow:0 8px 20px rgba(214,69,93,.28);border-radius:999px}
@media (max-width:1100px){body.studio .st-q{display:none}}
body.studio .emain{background:radial-gradient(900px 520px at 22% -10%,#ffe9ed 0,transparent 62%),radial-gradient(700px 500px at 100% 100%,#fff3e6 0,transparent 60%),var(--bg);justify-content:center;gap:32px;padding:0 16px}
[data-theme="dark"] body.studio .emain{background:var(--bg)}
/* thiệp trong khung điện thoại trắng bo tròn */
body.studio .stage{flex:none;width:398px;align-self:flex-start;height:calc(100% - 44px);margin-top:22px;border:8px solid var(--surface);border-radius:36px;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(120,40,50,.18)}
body.studio .phone iframe{border-radius:28px}
body.studio .sheet{width:600px;max-width:calc(100vw - 480px);background:none;border:0}
body.studio .sheet-body{padding:22px 8px 48px}
body.studio .tside{align-self:flex-start;height:calc(100% - 44px);margin-top:22px;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
body.studio .st-top{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;padding:14px 22px;box-shadow:var(--shadow);background:rgba(255,255,255,.92);backdrop-filter:blur(8px)}
body.studio .st-top .sprog i{background:var(--grad)}
body.studio .st-g{border:0;padding:16px 8px 8px;background:none;font:700 22px/1 var(--script);letter-spacing:0;text-transform:none;color:var(--primary)}
body.studio .st-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:76px;transition:box-shadow .2s,border-color .2s}
body.studio .st-sec:hover{border-color:#ecd0d4}
body.studio .st-h{padding:16px 22px;min-height:60px}
body.studio .st-n b{font-size:15.5px}
body.studio .st-sec[open]{border-color:color-mix(in srgb,var(--primary) 35%,var(--line));box-shadow:0 14px 36px rgba(214,69,93,.12)}
body.studio .st-sec[open]>.st-h{background:var(--primary-soft);border-bottom:1px solid var(--line)}
body.studio .st-sec[open]>.st-h .st-n b{color:var(--primary)}
body.studio .st-b{padding:20px 26px 24px}
body.studio .st-add{background:var(--surface);border:1px dashed color-mix(in srgb,var(--primary) 35%,var(--line));border-radius:var(--radius);margin-bottom:12px;padding:14px 20px}
body.studio .stg.on{background:var(--primary)}
body.st-find .st-g,body.st-find .st-add{display:none}
/* hàng kiểu bảng: nhãn bên trái, ô nhập, ô chọn nhỏ (danh xưng / Ông Bà) — ô nhập theo kiểu chung của web (.input) */
.frow{display:grid;grid-template-columns:88px minmax(0,1fr) 132px;gap:8px;align-items:center;margin-bottom:10px}
.frow.w2{grid-template-columns:88px minmax(0,1fr)}
.frow .fl{font-size:14px;font-weight:600;color:var(--ink)}
.frow .input{min-height:44px;padding-top:0;padding-bottom:0}
.fsep{border:0;border-top:1px dashed var(--line);margin:18px 0}
@keyframes stIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
/* hộp "Bắt đầu nhanh" gọn: tên chú rể / cô dâu và ngày / giờ luôn 2 cột (cả điện thoại), ô thấp hơn, một nút Lưu, đóng bằng ✕ góc trên */
.qs .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:10px}
.qs .field{margin-bottom:10px;gap:4px}
.qs .field input:not([type=checkbox]):not([type=radio]){min-height:42px;padding:8px 12px}
/* điện thoại: mọi hộp trong trình sửa xổ từ dưới lên giống bảng Mẫu & màu (thanh kéo, bo góc trên, sát đáy) */
@media (max-width:760px){
  .modal{place-items:end stretch;padding:0} /* mọi hộp sửa trong trình sửa: trượt từ dưới lên, không popup giữa màn */
  .modal .modal-box{width:100%;max-height:88vh;max-height:88dvh;border-radius:20px 20px 0 0;padding:24px 16px calc(16px + env(safe-area-inset-bottom));animation:sheetUp .22s ease-out}
  .modal .modal-box::before{content:"";position:absolute;z-index:6;left:50%;top:7px;translate:-50% 0;width:40px;height:4px;border-radius:4px;background:var(--line)}
}
</style>

    <button data-tab="media" aria-label="Nhạc nền"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></i><span>Nhạc</span></button>
    <button data-tab="guests" aria-label="Khách"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 5.2a3.3 3.3 0 0 1 0 6.6M18 14.8c2 .7 3.2 2.5 3.5 5.2"/></svg></i><span>Khách</span></button>
    <!-- bỏ tab "Thêm" (hiện/ẩn phần, đường dẫn, tạm ẩn thiệp) — code bảng vẫn còn trong editor.js nếu cần mở lại -->
