<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fffafa">
<title>Thanh toán</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/css/site.css">
<style>
.qrimg{width:220px;height:220px;margin:18px auto 10px;border-radius:16px;background:var(--card);padding:8px}
.rows{text-align:left;display:grid;gap:10px;font-size:14px;border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}
.rows div{display:flex;justify-content:space-between;gap:8px;align-items:center}
.cp{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--gold2);border-radius:999px;font-size:12px;padding:3px 10px;cursor:pointer;margin-left:6px}
.note{display:block;padding:12px;border-radius:14px;background:rgba(232,182,90,.1);color:var(--gold2);font-size:14px}
</style>
</head>
<body data-solid>
<header id="nav"></header>
<main class="solo"><div class="box center" id="box"><div class="skeleton" style="height:420px"></div></div></main>
<script src="/js/common.js"></script>
<script src="/js/site.js"></script>
<script>
const code = location.pathname.split('/').pop();
async function load() {
  let o;
  try { o = (await api('/api/orders/' + code, { allow401: true })).order; }
  catch (e) { $('#box').innerHTML = `<h1>Không tìm thấy đơn</h1><p class="muted">${esc(e.message)}</p>`; return; }
  document.title = 'Thanh toán ' + o.productName.toLowerCase();
  if (o.status === 'paid') {
    $('#box').innerHTML = `<p style="font-size:48px;margin:0">💖</p><h1>Đã thanh toán</h1><p class="muted">${esc(o.productName)} ${esc(o.card ? o.card.names : '')} đã được kích hoạt. Cảm ơn bạn!</p>`;
    return;
  }
  $('#box').innerHTML = `
    <span class="eyebrow">Thanh toán hộ</span>
    <h1>${esc(o.productName)}</h1>
    <p class="muted" style="margin:0">${esc(o.card ? o.card.names || o.card.title : '')}</p>
    <div class="grad" style="font-family:var(--serif);font-size:40px;font-weight:600;font-style:normal;margin-top:8px">${money(o.amount)}</div>
    <img class="qrimg" src="${esc(o.qr)}" alt="Mã QR chuyển khoản">
    <p class="muted" style="font-size:13px;margin:0">Mở app ngân hàng và quét mã — số tiền, nội dung đã điền sẵn</p>
    <div class="rows">
      <div><span class="muted">Ngân hàng</span><b>${esc(o.bank.name)}</b></div>
      <div><span class="muted">Số tài khoản</span><span><b>${esc(o.bank.accountNo)}</b><button class="cp" data-c="${esc(o.bank.accountNo)}">Chép</button></span></div>
      <div><span class="muted">Chủ tài khoản</span><span>${esc(o.bank.accountName)}</span></div>
      <div><span class="muted">Nội dung</span><span><b class="grad" style="font-style:normal">${esc(o.code)}</b><button class="cp" data-c="${esc(o.code)}">Chép</button></span></div>
    </div>
    ${o.claimedAt ? '<span class="note">Đã ghi nhận — sẽ kích hoạt ngay khi tiền về</span>' : '<button class="btn btn-main btn-lg block-btn" id="claim">Tôi đã chuyển khoản</button>'}`;
  $$('[data-c]').forEach(b => b.onclick = () => copyText(b.dataset.c));
  const c = $('#claim');
  if (c) c.onclick = async () => { await api(`/api/orders/${code}/claim`, { method: 'POST', allow401: true }); toast('Cảm ơn bạn! Sẽ kích hoạt ngay khi tiền về.'); load(); };
}
load();
</script>
</body>
</html>
