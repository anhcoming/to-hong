<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mẫu thiệp cưới online — truyền thống, tối giản, hoa lá | Cưới Nha</title>
<meta name="description" content="Bộ sưu tập mẫu thiệp cưới online: truyền thống chữ Hỷ, tối giản, hoa lá, chất liệu giấy. Lọc theo phong cách, màu sắc, xem trước như khách mời nhìn thấy và tạo thiệp miễn phí.">
<meta property="og:title" content="Mẫu thiệp cưới online — Cưới Nha">
<meta property="og:description" content="Lọc theo phong cách, màu sắc, xem trước và tạo thiệp cưới có tên từng khách. Dùng thử miễn phí.">
<meta property="og:image" content="/demo/cover-dodam-do-ruou.jpg">
<meta name="theme-color" content="#fffafa">
<link rel="canonical" href="/mau-thiep">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/css/site.css">
<style>
/* Trang bộ sưu tập mẫu: thanh lọc (tìm, phong cách, màu, nhãn, sắp xếp) + lưới ảnh bìa; bộ lọc ghi lên URL để gửi link được */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* bỏ phần giới thiệu: thanh lọc nằm ngay dưới thanh menu nổi */
main.wrap{padding-top:104px}
/* thanh lọc một hàng: tìm (icon bung ra ô gõ), phong cách dạng nút tròn + "Xem thêm", bên phải: nhãn dạng công tắc, màu & sắp xếp dạng menu thả */
.fbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;margin:0 0 22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.fside{display:flex;align-items:center;gap:8px;min-width:0}
#fRight{margin-left:auto}
.seg,.pill,.ddb{flex:none}
.srch{display:flex;align-items:center;flex:none;height:40px;width:40px;border:1px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden;transition:width .25s}
.srch.open{width:230px;border-color:#f2b6bf}
.srch button{flex:none;width:38px;height:38px;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.srch input{flex:1;min-width:0;border:0;outline:0;padding:0 12px 0 0;font:14px var(--sans);background:none;color:var(--ink)}
.pill,.ddb{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:500 14px var(--sans);color:var(--ink);cursor:pointer;white-space:nowrap}
.pill:hover,.ddb:hover{border-color:#f2b6bf}
.pill[aria-pressed="true"],.ddb.on{border-color:var(--red);background:#fff0f2;color:var(--red)}
.ddb::after{content:"";width:6px;height:6px;margin-left:2px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.7}
.ddb i,.ddm i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.seg{display:flex;height:40px;padding:3px;border-radius:999px;background:#f5eff0}
.seg button{border:0;background:none;padding:0 14px;border-radius:999px;font:500 14px var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(120,40,50,.14)}
.dd{position:relative;flex:none}
/* menu thả đặt position:fixed theo nút để không bị khung cuộn ngang (điện thoại) cắt mất */
.ddm{position:fixed;z-index:60;min-width:190px;padding:6px;border-radius:14px;background:var(--card);box-shadow:0 20px 50px rgba(120,40,50,.18);display:none}
.dd.open .ddm{display:block}
.ddm button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:none;font:14px var(--sans);color:var(--ink);text-align:left;cursor:pointer}
.ddm button:hover{background:var(--bg2)}
.ddm button[aria-pressed="true"]{color:var(--red);font-weight:600}
.ddm small{margin-left:auto;color:var(--muted);font-size:12px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 16px;color:var(--muted);font-size:14px}
.meta button{border:0;background:none;color:var(--red);font:600 14px var(--sans);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 22px;padding-bottom:80px}
.tc{min-width:0}
.tc .pic{position:relative;display:block;border-radius:16px;overflow:hidden;box-shadow:0 14px 30px rgba(120,40,50,.14);transition:transform .3s,box-shadow .3s}
.tc .pic:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(120,40,50,.2)}
.tc img{width:100%;aspect-ratio:9/16;object-fit:cover;object-position:top;background:var(--bg2)}
.tc .tag{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700}
.tc .tag.hot{background:#8b5cf6}
.tc .peek{position:absolute;left:50%;bottom:14px;transform:translate(-50%,8px);padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.95);font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transition:.25s;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.tc .pic:hover .peek,.tc .pic:focus-visible .peek{opacity:1;transform:translate(-50%,0)}
.tc .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.tc b{font-size:16px}
.tc .use{flex:none;font-size:13px;font-weight:600;color:var(--red)}
.tc .use:hover{text-decoration:underline}
.tc .sub2{margin-top:2px;font-size:13px;color:var(--muted)}
.sw{display:flex;gap:6px;margin-top:8px;min-height:20px}
.sw button{width:20px;height:20px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 2px var(--red)}
.none{grid-column:1/-1;padding:60px 16px;text-align:center;color:var(--muted)}
.chon{display:none;margin:0 auto 18px;max-width:640px;padding:12px 18px;border-radius:14px;background:#fff0f2;color:var(--ink);font-size:15px;text-align:center}
.chon.show{display:block}
@media (max-width:700px){
  .fbar{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:10px}
  #fRight{margin-left:-16px}
  .fside{overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .fside::-webkit-scrollbar{display:none}
  .srch.open{width:180px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
  .tc .row{flex-direction:column;align-items:flex-start;gap:2px}
  .tc .use{font-size:13px;order:3}
}
/* nền tối */
[data-theme="dark"] .seg{background:#2a2124}
[data-theme="dark"] .pill[aria-pressed="true"],[data-theme="dark"] .ddb.on,[data-theme="dark"] .chon{background:#3a1f26}
[data-theme="dark"] .ddm{box-shadow:0 20px 50px rgba(0,0,0,.45)}
[data-theme="dark"] .ddm button:hover{background:#2a2023}
[data-theme="dark"] .srch.open,[data-theme="dark"] .pill:hover,[data-theme="dark"] .ddb:hover{border-color:#5a3540}
</style>
</head>
<body data-page="tpl">
<header id="nav"></header>

<h1 class="sr">Mẫu thiệp cưới online</h1>

<main class="wrap">
  <p class="chon" id="chon"><b>Chọn một mẫu để tạo thiệp mới</b> — bấm vào mẫu để xem trước, rồi bấm <b>Dùng mẫu →</b>.</p>
  <div class="fbar" role="search">
    <div class="fside" id="fLeft">
      <div class="srch" id="srch"><button type="button" id="srchBtn" aria-label="Tìm mẫu"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6f6668" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><input id="q" type="search" placeholder="Tìm mẫu…" aria-label="Tìm mẫu theo tên"></div>
      <div class="fside" id="fStyle" style="margin:0;padding:0;overflow:visible"></div>
    </div>
    <div class="fside" id="fRight"></div>
  </div>
  <div class="meta"><span id="shown"></span><button id="clear" hidden>Xoá bộ lọc</button></div>
  <div class="grid" id="grid"></div>
</main>

<footer id="foot"></footer>
<script src="/js/site.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cover = (id, pal) => `/demo/cover-${id}-${pal}.jpg`;
  // nhóm màu theo phần đầu mã bảng màu (do-ruou, do-son → đỏ…)
  const FAMILY = { do: 'Đỏ', xanh: 'Xanh', nau: 'Nâu', tim: 'Tím', hong: 'Hồng', vang: 'Vàng', den: 'Đen', trang: 'Trắng' };
  const fam = (p) => p.id.split('-')[0];
  const qs = new URLSearchParams(location.search);
  const F = { q: qs.get('q') || '', style: qs.get('phong-cach') || '', color: qs.get('mau-sac') || '', tag: qs.get('nhan') || '', sort: qs.get('sap-xep') || '' };
  if (qs.has('chon')) $('#chon').classList.add('show');
  let T = [], G = [];

  function sync() {
    const u = new URLSearchParams();
    if (qs.has('chon')) u.set('chon', '1');
    if (F.q) u.set('q', F.q);
    if (F.style) u.set('phong-cach', F.style);
    if (F.color) u.set('mau-sac', F.color);
    if (F.tag) u.set('nhan', F.tag);
    if (F.sort) u.set('sap-xep', F.sort);
    history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : ''));
  }
  const SHOW = 3; // số phong cách hiện thẳng, còn lại vào "Xem thêm"
  const SORTS = [['', 'Nổi bật'], ['new', 'Mới nhất'], ['az', 'Tên A → Z']];
  const opt = (k, v, label, extra = '') => `<button type="button" data-k="${k}" data-v="${esc(v)}" aria-pressed="${F[k] === v}">${label}${extra}</button>`;
  const dd = (id, label, on, items) => `<div class="dd" id="${id}"><button type="button" class="ddb${on ? ' on' : ''}" aria-expanded="false">${label}</button><div class="ddm">${items}</div></div>`;
  function bar(base) {
    const used = G.filter((g) => T.some((t) => t.group === g.id));
    const shown = used.slice(0, SHOW), more = used.slice(SHOW);
    const moreOn = more.find((g) => g.id === F.style);
    const n = (k, test) => `<small>${base(k).filter(test).length}</small>`;
    $('#fStyle').innerHTML = [{ id: '', name: 'Tất cả' }, ...shown].map((g) => `<button type="button" class="pill" data-k="style" data-v="${esc(g.id)}" aria-pressed="${F.style === g.id}">${esc(g.name)}</button>`).join('')
      + (more.length ? dd('ddMore', moreOn ? esc(moreOn.name) : 'Xem thêm', !!moreOn, more.map((g) => opt('style', g.id, esc(g.name), n('style', (t) => t.group === g.id))).join('')) : '');
    const fams = [];
    T.forEach((t) => t.palettes.forEach((p) => { if (!fams.some((f) => f.id === fam(p))) fams.push({ id: fam(p), name: FAMILY[fam(p)] || p.name, dot: p.swatch[1] }); }));
    const cur = fams.find((f) => f.id === F.color);
    $('#fRight').innerHTML = `<div class="seg" role="group" aria-label="Nhãn">${[['', 'Tất cả'], ['Hot', '🔥 Hot'], ['Mới', '✨ Mới']].map(([v, l]) => `<button type="button" data-k="tag" data-v="${v}" aria-pressed="${F.tag === v}">${l}</button>`).join('')}</div>`
      + dd('ddColor', cur ? `<i style="background:${cur.dot}"></i>${esc(cur.name)}` : 'Màu sắc', !!cur, opt('color', '', 'Tất cả màu') + fams.map((f) => opt('color', f.id, `<i style="background:${f.dot}"></i>${esc(f.name)}`, n('color', (t) => t.palettes.some((p) => fam(p) === f.id)))).join(''))
      + dd('ddSort', SORTS.find(([v]) => v === F.sort)[1], false, SORTS.map(([v, l]) => opt('sort', v, l)).join(''));
  }
  function closeMenus(except) { document.querySelectorAll('.dd.open').forEach((d) => { if (d !== except) { d.classList.remove('open'); d.querySelector('.ddb').setAttribute('aria-expanded', false); } }); }
  document.querySelector('.fbar').addEventListener('click', (e) => {
    const t = e.target.closest('.ddb');
    if (t) {
      const d = t.parentElement, on = !d.classList.contains('open');
      closeMenus(d); d.classList.toggle('open', on); t.setAttribute('aria-expanded', on);
      if (on) { const r = t.getBoundingClientRect(), m = d.querySelector('.ddm'); m.style.top = r.bottom + 8 + 'px'; m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px'; }
      return;
    }
    const b = e.target.closest('[data-k]'); if (!b) return;
    F[b.dataset.k] = b.dataset.v; closeMenus(); render();
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.dd')) closeMenus(); });
  addEventListener('scroll', () => closeMenus(), { passive: true });
  document.querySelectorAll('.fside').forEach((x) => x.addEventListener('scroll', () => closeMenus(), { passive: true }));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });
  // tìm: bấm icon thì bung ô gõ
  const srch = $('#srch');
  $('#srchBtn').onclick = () => { srch.classList.add('open'); $('#q').focus(); };
  $('#q').addEventListener('blur', () => { if (!F.q) srch.classList.remove('open'); });

  function render() {
    sync();
    const q = F.q.trim().toLowerCase();
    let list = T.filter((t) => (!F.style || t.group === F.style)
      && (!F.color || t.palettes.some((p) => fam(p) === F.color))
      && (!F.tag || t.badge === F.tag)
      && (!q || (t.name + ' ' + t.desc).toLowerCase().includes(q)));
    if (F.sort === 'new') list = list.slice().sort((a, b) => (b.badge === 'Mới') - (a.badge === 'Mới'));
    if (F.sort === 'az') list = list.slice().sort((a, b) => a.name.localeCompare(b.name, 'vi'));

    // số đếm trong menu tính trên các bộ lọc còn lại
    const base = (skip) => T.filter((t) => (skip === 'style' || !F.style || t.group === F.style) && (skip === 'color' || !F.color || t.palettes.some((p) => fam(p) === F.color)) && (skip === 'tag' || !F.tag || t.badge === F.tag) && (!q || (t.name + ' ' + t.desc).toLowerCase().includes(q)));
    bar(base);

    $('#shown').textContent = list.length === T.length ? `${T.length} mẫu` : `${list.length} / ${T.length} mẫu`;
    $('#clear').hidden = !(F.q || F.style || F.color || F.tag);
    $('#grid').innerHTML = list.length ? list.map((t) => {
      // lọc theo màu thì bìa hiện đúng bảng màu đó
      const p = (F.color && t.palettes.find((x) => fam(x) === F.color)) || t.palettes[0];
      const g = G.find((x) => x.id === t.group);
      return `<div class="tc" data-tpl="${t.id}">
        <a class="pic" href="/demo/${t.id}?palette=${p.id}" aria-label="Xem thử mẫu ${esc(t.name)}">${t.badge ? `<span class="tag${t.badge === 'Hot' ? ' hot' : ''}">${esc(t.badge)}</span>` : ''}<img src="${cover(t.id, p.id)}" alt="Mẫu thiệp ${esc(t.name)}" loading="lazy"><span class="peek">Xem thử</span></a>
        <div class="row"><b>${esc(t.name)}</b><a class="use" href="/thiep-cua-toi?tao=${t.id}&mau=${p.id}">Dùng mẫu →</a></div>
        <div class="sub2">${esc(g ? g.name : '')}</div>
        <div class="sw">${t.palettes.length > 1 ? t.palettes.map((q2) => `<button type="button" data-pal="${q2.id}" title="${esc(q2.name)}" aria-label="Bảng màu ${esc(q2.name)}" class="${q2.id === p.id ? 'on' : ''}" style="background:linear-gradient(135deg,${q2.swatch[0]} 50%,${q2.swatch[1]} 50%)"></button>`).join('') : ''}</div>
      </div>`;
    }).join('') : '<div class="none"><p style="font-size:40px;margin:0">🔍</p><p>Chưa có mẫu khớp bộ lọc.</p><button class="btn btn-ghost" id="clear2">Xoá bộ lọc</button></div>';
    const c2 = $('#clear2'); if (c2) c2.onclick = clear;
  }
  function clear() { Object.assign(F, { q: '', style: '', color: '', tag: '' }); $('#q').value = ''; srch.classList.remove('open'); render(); }

  $('#q').value = F.q;
  if (F.q) srch.classList.add('open');
  $('#q').addEventListener('input', (e) => { F.q = e.target.value; render(); });
  $('#clear').onclick = clear;
  $('#grid').addEventListener('click', (e) => {
    const b = e.target.closest('.sw button'); if (!b) return;
    const card = b.closest('.tc'), id = card.dataset.tpl, pal = b.dataset.pal;
    card.querySelectorAll('.sw button').forEach((x) => x.classList.toggle('on', x === b));
    card.querySelector('.pic').href = `/demo/${id}?palette=${pal}`;
    card.querySelector('img').src = cover(id, pal);
    card.querySelector('.use').href = `/thiep-cua-toi?tao=${id}&mau=${pal}`;
  });
  document.addEventListener('meta', (e) => {
    T = e.detail.templates; G = e.detail.templateGroups || [];
    render();
  });
})();
</script>
</body>
</html>
