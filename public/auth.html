<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffafa">
<meta name="robots" content="noindex">
<title>Đăng nhập — Cưới Nha</title>
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="/css/site.css">
</head>
<body data-solid>
<header id="nav"></header>
<main class="solo">
  <div class="box">
    <span class="eyebrow" data-brand>Cưới Nha</span>
    <h1 id="title">Chào mừng bạn</h1>
    <p class="muted" id="sub2" style="margin:0">Sổ tay cưới miễn phí: việc cần làm, ngân sách, khách mời — và thiệp cưới online.</p>
    <div class="seg"><button data-m="login" class="on">Đăng nhập</button><button data-m="register">Tạo tài khoản</button></div>
    <div id="gbox" hidden>
      <a class="gbtn" id="gbtn" href="/auth/google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Tiếp tục với Google
      </a>
      <div class="or"><span>hoặc dùng email</span></div>
    </div>
    <form id="f">
      <label class="field" id="nameF" hidden><span>Tên của bạn</span><input name="name" autocomplete="name" maxlength="80"></label>
      <label class="field"><span>Email</span><input name="email" type="email" required autocomplete="email"></label>
      <label class="field"><span>Mật khẩu</span><input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
      <button class="btn btn-main btn-lg block-btn" id="sub">Đăng nhập</button>
      <p class="err" id="err"></p>
    </form>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/site.js"></script>
<script>
let mode = new URLSearchParams(location.search).get('dang-ky') ? 'register' : 'login';
const next = new URLSearchParams(location.search).get('next') || '/so-tay';
const loi = new URLSearchParams(location.search).get('loi');
// đến từ trình sửa khi chưa đăng nhập: thiệp nháp sẽ được chuyển vào tài khoản
if (/^\/sua\//.test(next)) $('#sub2').textContent = 'Đăng nhập để lưu thiệp bạn vừa làm — nội dung đã sửa được giữ nguyên.';
// Nút Google chỉ hiện khi máy chủ đã cấu hình Client ID
document.addEventListener('meta', (e) => {
  if (!e.detail.googleLogin) return;
  $('#gbox').hidden = false;
  $('#gbtn').href = '/auth/google?next=' + encodeURIComponent(next);
});
function setMode(m) {
  mode = m;
  $$('.seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#nameF').hidden = m !== 'register';
  $('#sub').textContent = m === 'register' ? 'Tạo tài khoản miễn phí' : 'Đăng nhập';
  $('#title').innerHTML = m === 'register' ? 'Bắt đầu <span class="grad">hành trình</span>' : 'Chào mừng <span class="grad">trở lại</span>';
  $('[name=password]').autocomplete = m === 'register' ? 'new-password' : 'current-password';
  $('#err').textContent = '';
  document.title = (m === 'register' ? 'Tạo tài khoản' : 'Đăng nhập') + ' — ' + (window.META ? META.brand : 'Cưới Nha');
}
$$('.seg button').forEach(b => b.onclick = () => setMode(b.dataset.m));
setMode(mode);
if (loi) $('#err').textContent = loi;
$('#f').onsubmit = async (e) => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  $('#sub').disabled = true;
  try {
    await api('/api/auth/' + mode, { method: 'POST', body: fd, allow401: true });
    location.href = next.startsWith('/') && !next.startsWith('//') ? next : '/so-tay';
  } catch (err) {
    $('#err').textContent = err.message;
  } finally {
    $('#sub').disabled = false;
  }
};
</script>
</body>
</html>
